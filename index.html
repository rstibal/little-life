/* ---------- where and how each person is drawn ---------- */

// A seat is claimed on arrival and kept, so nobody slides along the sofa when the
// person beside them gets up.
function seatFor(s, o, n) {
  if (s.seat && s.seat.id === o.id) return s.seat.k;
  const used = new Set(everyone().filter(p => p !== s && p.seat && p.seat.id === o.id).map(p => p.seat.k));
  let k = 0;
  while (used.has(k) && k < n - 1) k++;
  s.seat = { id: o.id, k };
  return k;
}

// Poses key off arrival, not intent — nobody sits down until they've got there.
function placeSim(s) {
  const arrived = !s.path.length && !!s.held;
  const o = arrived ? byId(s.held) : null;
  let gx = s.tx + 0.5, gy = s.ty + 0.5, z = 0, fx = s.dirx, fy = s.diry;
  let pose = s.path.length ? 'walk' : 'stand', depth = gx + gy;
  if (o) {
    const ocx = o.x + o.w / 2, ocy = o.y + o.h / 2;
    fx = ocx - gx; fy = ocy - gy;
    // drawn at the furniture, so sorted at the furniture — otherwise sleepers vanish behind the bed
    depth = ocx + ocy + 0.55;
    // ...except whoever stands on their own tile in front of it, which sorts them correctly already
    const ownTile = () => { depth = gx + gy + 0.05; };
    switch (s.actKey === 'sleep' ? 'bed' : o.kind || o.id) {
      case 'bed':
      case 'tub':      pose = 'lie'; break;
      case 'sofa':     gx = o.x + .55 + seatFor(s, o, 2) * .9; gy = o.y + .56; z = .19; pose = 'sit'; fx = 0; fy = 1; break;
      case 'armchair': gx = ocx; gy = o.y + .56; z = .19; pose = 'sit'; fx = 0; fy = 1; break;
      case 'bench':    gx = o.x + .4; gy = ocy; z = .36; pose = 'sit'; fx = 1; fy = 0; break;
      case 'toilet':   gx = ocx; gy = o.y + .5; z = .17; pose = 'sit'; fx = 0; fy = 1; break;
      case 'table': {
        // seats 0 and 1 are across the table, facing us, so they fill first
        const k = seatFor(s, o, 4);
        gx = o.x + .55 + (k & 1) * .9; z = .19;
        if (k < 2) { gy = o.y + .86; pose = 'sit'; fx = 0; fy = 1; depth = ocx + ocy - .3; }
        else       { gy = o.y + 2.14; pose = 'sitback'; fx = 0; fy = -1; }
        break;
      }
      case 'desk':     gx = o.x + .8; gy = o.y + .5; z = .22; pose = 'sitback'; fx = -1; fy = 0; break;
      case 'mat':      gx = ocx; gy = ocy; pose = 'stretch'; fx = .3; fy = 1; ownTile(); break;
      case 'shower':   gx = ocx; gy = ocy; fx = 0; fy = 1; break;
      case 'guitar':   gx += (ocx - gx) * .3; gy += (ocy - gy) * .3; pose = 'guitar'; fx = 0; fy = 1; break;
      case 'arcade':   gx = ocx; gy = o.y + 1.3; pose = 'use'; fx = 0; fy = -1; ownTile(); break;
      case 'tank':     gx = ocx; gy = o.y + 1.35; fx = 0; fy = -1; ownTile(); break;
      case 'easel':    gx = o.x + 1.3; gy = ocy; pose = 'use'; fx = -1; fy = 0; ownTile(); break;
      case 'record':   pose = 'dance'; fx = 0; fy = 1; ownTile(); break;
      default:         gx += (ocx - gx) * .28; gy += (ocy - gy) * .28; pose = 'use';
    }
  }
  const c = convOf(s);
  if (c && s.actKey === 'chat' && !s.path.length) {
    const other = c.a === s ? c.b : c.a;
    fx = other.tx - s.tx; fy = other.ty - s.ty; pose = 'talk';
  }
  return { gx, gy, z, fx, fy, pose, o, depth };
}
const simDepth = s => placeSim(s).depth;

function shadowAt(p, rx) {
  for (let dy = -1; dy <= 1; dy++) for (let dx = -rx; dx <= rx; dx++) {
    if ((dx * dx) / (rx * rx) + dy * dy > 1.2 || ((p.x + dx + p.y + dy) & 1)) continue;
    const x = p.x + dx, y = p.y + dy;
    if (x >= 0 && y >= 0 && x < PW && y < PH) buf[y * PW + x] = scale(buf[y * PW + x], .68);
  }
}

const bathWater = (px, py) => C(hash(px, py) > 0.78 ? '#ffffff' : (px + py) & 1 ? '#bfe6f0' : '#a6d8e8');

function drawSim(s) {
  const pl = placeSim(s);
  if (pl.pose === 'lie') {
    const o = pl.o, L = o.h, tub = o.id === 'tub';
    const hp = P3(o.x + .5, o.y + (tub ? .42 : L > 1 ? .32 : .26), .3);
    const sp = personSprite(s, 'head', 0, false, tub ? moodFace(s) : 'sleep');
    blit(sp, hp.x - SAX, hp.y - sp.ay);
    if (tub) faceT(o.x + .22, o.y + .62, o.x + .78, o.y + L - .2, .42, bathWater);   // up to the chin
    else {
      box(o.x + .08, o.y + L * .4, .84, L * .6 - .08, .14, .26, o.color);           // duvet pulled up
      box(o.x + .08, o.y + L * .4, .84, .1, .4, .02, '#f1e9da', { outline:false });
    }
    s._head = { x: hp.x, y: hp.y - sp.ay + sp.top };
    return;
  }
  const p = P3(pl.gx, pl.gy, pl.z);
  if (!pl.z) shadowAt(p, 5);
  const { back, flip } = facing(pl.fx, pl.fy);
  const fr = pl.pose === 'walk' ? Math.floor(s.bob * 0.8) & 3
           : Math.floor(animT * (pl.pose === 'dance' ? 4 : 2.5) + s.i * .7) & 1;
  let face = s.actKey === 'sleep' ? 'sleep' : moodFace(s);
  const c = convOf(s);
  if (pl.pose === 'talk' && face !== 'blink') face = c && c.mode === 'argue' ? 'angry' : fr ? 'talk' : 'happy';
  if (pl.pose === 'dance' && face !== 'blink') face = 'happy';
  const sp = personSprite(s, pl.pose, fr, back, face);
  blit(sp, p.x - SAX, p.y - sp.ay, flip);
  if (pl.pose === 'sit' && s.actKey === 'read')                   // a book held open
    for (let j = 0; j < 3; j++) for (let i = -2; i < 2; i++)
      put(p.x + i, p.y - 5 + j, C(j === 0 ? '#f4f0e6' : i === -2 || i === 1 ? '#8e3f45' : '#c4645a'));
  if (pl.pose === 'sit' && s.actKey === 'game')                   // a controller
    for (let i = -2; i < 2; i++) { put(p.x + i, p.y - 3, C('#2b2f3a')); put(p.x + i, p.y - 2, C(i & 1 ? '#d9534f' : '#2b2f3a')); }
  s._head = { x: p.x, y: p.y - sp.ay + sp.top };
}

const ICON_OF = { sleep:'zzz', eat:'plate', cook:'pan', snack:'sandwich', toilet:'drop', shower:'shower',
                  bath:'tub', wash:'bubbles', tv:'tv', game:'pad', cards:'cards', dance:'disc', fish:'fish',
                  read:'book', paint:'palette', guitar:'note', arcade:'joystick', stretch:'stretch',
                  online:'chat', relax:'leaf', chat:'dots' };
function iconFor(s) {
  if (!s.actKey || (s.actKey === 'sleep' && !s.path.length)) return null;   // the Zs say it
  const c = convOf(s);
  if (s.actKey === 'chat' && c)
    return c.mode === 'argue' ? 'anger' : residents(c) && (rel > 52 || family.partners) ? 'heart' : 'dots';
  return ICON_OF[s.actKey];
}
function drawBubble(s) {
  const icon = iconFor(s);
  if (!icon || !s._head) return;
  const bx = Math.min(PW - BUBBLE.w, s._head.x + 2), by = Math.max(0, s._head.y - BUBBLE.h + 1);
  blit(BUBBLE, bx, by);
  blit(ICON[icon], bx + 3, by + 2);
}

/* ---------- particles ---------- */

const parts = [];
function spawn(kind, x, y, vx, vy, life) {
  if (parts.length < 160) parts.push({ kind, x, y, vx, vy, life, age: 0 });
}
function emitParticles(dt) {
  if (!dt) return;
  const chance = r => Math.random() < r * dt, rnd = (a, b) => a + Math.random() * (b - a);
  for (const s of everyone()) {
    const hd = s._head, here = !s.path.length;
    if (!hd || !here) continue;
    if (s.actKey === 'sleep' && chance(0.7)) spawn('z', hd.x + 3, hd.y + 1, 3, -6, 2.4);
    if (s.actKey === 'guitar' && chance(1.4)) spawn('note', hd.x + 5, hd.y + 8, rnd(3, 7), -9, 1.7);
  }
  for (const c of convs) {
    if (!c.a._head || !c.b._head) continue;
    const mx = (c.a._head.x + c.b._head.x) / 2, my = Math.min(c.a._head.y, c.b._head.y);
    if (c.mode === 'argue') { if (chance(1.6)) spawn('anger', mx + rnd(-8, 4), my + rnd(-2, 4), 0, -4, 0.9); }
    else if (residents(c) && (rel > 45 || family.partners) && chance(0.9)) spawn('heart', mx + rnd(-4, 2), my + 2, rnd(-2, 2), -8, 1.8);
  }
  if (inUse('record', 'dance') && chance(1.8)) {
    const p = P3(9.78, 8.44, .8);
    spawn('note', p.x + rnd(-2, 2), p.y, rnd(-6, 6), -9, 1.8);
  }
  if (inUse('stove', 'cook') && chance(5)) {
    const p = P3(.3, 5.3, .62);
    spawn('steam', p.x + rnd(-2, 2), p.y, rnd(-2, 2), -10, 1.3);
  }
  if (inUse('shower')) {
    for (let k = 0; k < 3; k++) if (chance(14)) {
      const p = P3(rnd(6.25, 6.75), rnd(.25, .75), .82);
      spawn('drop', p.x, p.y, 0, 70, .38);
    }
    if (chance(3)) { const p = P3(6.5, .5, .9); spawn('steam', p.x + rnd(-5, 5), p.y, rnd(-2, 2), -6, 1.6); }
  }
  if (inUse('tub') && chance(1.5)) { const p = P3(9.5, 1.1, .5); spawn('steam', p.x + rnd(-4, 4), p.y, rnd(-2, 2), -6, 1.8); }
}
function stepParticles(dt) {
  for (let i = parts.length - 1; i >= 0; i--) {
    const p = parts[i];
    p.age += dt;
    if (p.age >= p.life) { parts.splice(i, 1); continue; }
    p.x += p.vx * dt; p.y += p.vy * dt;
  }
}
function drawParticles() {
  for (const p of parts) {
    const x = Math.round(p.x + (p.kind === 'z' || p.kind === 'heart' ? Math.sin(p.age * 4) * 1.5 : 0));
    const y = Math.round(p.y);
    if (p.kind === 'steam') {
      const r = 1 + Math.floor(p.age * 2);
      for (let dy = -r; dy <= r; dy++) for (let dx = -r; dx <= r; dx++) {
        const qx = x + dx, qy = y + dy;
        if (dx*dx + dy*dy > r*r || ((qx + qy) & 1) || qx < 0 || qy < 0 || qx >= PW || qy >= PH) continue;
        buf[qy * PW + qx] = blend(buf[qy * PW + qx], C('#ffffff'), .45 * (1 - p.age / p.life));
      }
    } else if (p.kind === 'drop') {
      put(x, y, C('#a8dcf0')); put(x, y + 1, C('#d8f0fa'));
    } else {
      if (p.age > p.life * .7 && (Math.floor(p.age * 16) & 1)) continue;     // flicker out
      const sp = PARTICLE[p.kind];
      blit(sp, x - (sp.w >> 1), y - (sp.h >> 1));
    }
  }
}

/* ---------- light ---------- */

// ambient multiplier through the day: white at noon, warm at the ends, blue at night
const AMB = [[0,[.38,.43,.66]],[5,[.42,.46,.68]],[6.5,[.86,.78,.78]],[7.5,[1,1,1]],[16.5,[1,1,1]],
             [18.5,[1,.86,.74]],[20,[.62,.64,.84]],[22,[.42,.46,.68]],[24,[.38,.43,.66]]];
let LR = new Float32Array(PW * PH), LG = new Float32Array(PW * PH), LB = new Float32Array(PW * PH);

function activeLights(dark) {
  const L = [], add = (gx, gy, z, r, c, k) => { if (k > 0.01) L.push({ ...P(gx, gy, z), r, c, k }); };
  if (lampsOn) {
    add(9.5, 6.5, 22, 104, [1, .78, .45], .9 * dark);
    const h = hour();
    if (h > 17 || h < 1) add(2.6, .4, 16, 62, [1, .8, .5], .75 * dark);
  }
  const screen = (.3 + .7 * dark);
  const flicker = .8 + .2 * Math.sin(animT * 9) * Math.sin(animT * 3.1);
  if (inUse('sofa', 'tv'))      add(7, 8.9, 14, 72, [.5, .66, 1], screen * flicker);
  if (inUse('sofa', 'game'))    add(7, 8.9, 14, 72, [.85, .5, .95], screen * flicker);
  if (inUse('fridge'))          add(.95, 4.5, 20, 52, [.85, .95, 1], screen);
  if (inUse('stove', 'cook'))   add(.5, 5.5, 20, 38, [1, .55, .25], screen * .8);
  if (inUse('desk'))            add(.3, 1.5, 22, 40, [.55, .75, 1], screen * .8);
  add(6.5, 4.95, 26, 46, [.4, .95, .9], (inUse('arcade') ? 1 : .4) * .8 * dark);
  add(5.5, 4.9, 22, 40, [.45, .85, 1], .55 * dark);                               // the fish tank
  if (animT < doorOpenUntil)    add(.2, 8.5, 20, 44, [.9, .88, .8], .6 * dark);    // landing light through the door
  return L;
}

// Light falls off in quarter steps, dithered where the steps meet — pools with a
// visible edge, the way lamplight looks in pixel art, rather than smooth gradients.
function lightPass(amb, dark) {
  const lights = activeLights(dark);
  if (amb[0] > .995 && amb[1] > .995 && amb[2] > .995 && !lights.length) return;
  LR.fill(amb[0]); LG.fill(amb[1]); LB.fill(amb[2]);
  for (const l of lights) {
    const x0 = Math.max(0, Math.floor(l.x - l.r)), x1 = Math.min(PW - 1, Math.ceil(l.x + l.r));
    const y0 = Math.max(0, Math.floor(l.y - l.r / 2)), y1 = Math.min(PH - 1, Math.ceil(l.y + l.r / 2));
    for (let y = y0; y <= y1; y++) for (let x = x0; x <= x1; x++) {
      const dx = x - l.x, dy = (y - l.y) * 2, d = Math.sqrt(dx * dx + dy * dy) / l.r;
      if (d >= 1) continue;
      const f = Math.floor((1 - d) * 4 + bayer(x, y)) / 4 * l.k;
      if (f <= 0) continue;
      const i = y * PW + x;
      LR[i] += l.c[0] * f; LG[i] += l.c[1] * f; LB[i] += l.c[2] * f;
    }
  }
  for (let i = 0; i < buf.length; i++) {
    if (glow[i]) continue;
    const c = buf[i];
    buf[i] = pack(clamp8((c & 255) * LR[i]), clamp8(((c >>> 8) & 255) * LG[i]), clamp8(((c >>> 16) & 255) * LB[i]));
  }
}

/* ---------- frame ---------- */

let animT = 0;
function render(dt = 0) {
  animT += dt;
  const h = hour(), amb = keyed(AMB, h);
  const dark = Math.max(0, Math.min(1, (1 - (amb[0] + amb[1] + amb[2]) / 3) / 0.5));
  lampsOn = dark > 0.12;
  skyTop = keyed(SKY, h, 1); skyBot = keyed(SKY, h, 2);
  prepClock();

  if (floorKey !== wallMode) { bakeFloor(); floorKey = wallMode; }
  buf.set(floorBuf); glow.fill(0);
  sunPatches();

  const items = [];
  for (const tag of walls) {
    const [dir, xs, ys] = tag.split(':');
    const x = +xs, y = +ys;
    // sorted at the wall's middle, so whatever stands just behind it is drawn first and gets hidden
    // (at -0.12 the desk and wardrobe were drawn over the walls in front of them)
    items.push({ depth: x + y + 0.45, draw: () => drawWall(dir, x, y) });
  }
  for (const o of OBJECTS) {
    const d = (o.x + o.w / 2) + (o.y + o.h / 2);
    items.push({ depth: d, draw: () => drawObject(o) });
    if (BACK[o.id]) items.push({ depth: d - 0.6, draw: () => BACK[o.id](o) });
    if (FRONT[o.id]) items.push({ depth: d + 0.7, draw: () => FRONT[o.id](o) });
  }
  for (const s of everyone()) {
    s._head = null;
    items.push({ depth: simDepth(s), draw: () => drawSim(s) });
  }
  items.sort((a, b) => a.depth - b.depth);
  for (const it of items) it.draw();

  lightPass(amb, dark);
  emitParticles(dt);
  stepParticles(dt);
  drawParticles();
  for (const s of everyone()) drawBubble(s);

  if (!frameImg) { frameImg = ctx.createImageData(PW, PH); frameView = new Uint32Array(frameImg.data.buffer); }
  frameView.set(buf);
  ctx.putImageData(frameImg, 0, 0);
}

// a card's little portrait, redrawn only when the face on it changes
function paintPortrait(i, s) {
  if (typeof ImageData === 'undefined') return;
  const el = document.getElementById('face-' + i);
  if (!el || !el.getContext) return;
  const face = moodFace(s);
  const key = [face, s.colors.hair, s.colors.skin].join('|');
  if (el._key === key) return;
  el._key = key;
  const sp = personSprite(s, 'head', 0, false, face);
  let x0 = SW, x1 = -1, y0 = SH, y1 = -1;
  for (let y = 0; y < SH; y++) for (let x = 0; x < SW; x++)
    if (sp.px[y * SW + x]) { x0 = Math.min(x0, x); x1 = Math.max(x1, x); y0 = Math.min(y0, y); y1 = Math.max(y1, y); }
  const img = new ImageData(16, 16), out = new Uint32Array(img.data.buffer);
  const ox = Math.floor((16 - (x1 - x0 + 1)) / 2) - x0, oy = Math.max(0, Math.floor((16 - (y1 - y0 + 1)) / 2)) - y0;
  for (let y = y0; y <= y1; y++) for (let x = x0; x <= x1; x++) {
    const tx = x + ox, ty = y + oy, c = sp.px[y * SW + x];
    if (c && tx >= 0 && ty >= 0 && tx < 16 && ty < 16) out[ty * 16 + tx] = c;
  }
  el.getContext('2d').putImageData(img, 0, 0);
}

/* ---------- readouts ---------- */

const cards = document.getElementById('cards');

function buildCards() {
  cards.innerHTML = people.map((s, i) => {
    const rows = NEEDS.map(n =>
      `<div class="need-row"><span class="lbl">${n.label}</span>` +
      `<span class="bar"><i id="b-${i}-${n.k}"></i></span></div>`).join('');
    return `
  <div class="card px">
    <div class="card-body">
      <div>
        <div class="card-head">
          <canvas class="face" id="face-${i}" width="16" height="16" aria-hidden="true"></canvas>
          <div class="who">
            <input class="nm" value="${s.name}" maxlength="8" aria-label="Name" data-i="${i}">
            <span class="sub"><span id="mw-${i}"></span> · <span class="traits">${s.traits.map(t => t.name).join(' · ')}</span></span>
          </div>
        </div>
        <div class="act" id="act-${i}"></div>
      </div>
      <div class="needs">${rows}</div>
    </div>
  </div>`;
  }).join('');
  layout();

  cards.querySelectorAll('.nm').forEach(inp => {
    inp.addEventListener('input', () => {
      people[+inp.dataset.i].name = inp.value.trim() || '?';
    });
  });
}
buildCards();

function fmtTime() {
  const m = Math.floor(minutes) % 1440;
  let h = Math.floor(m/60);
  const mm = String(m%60).padStart(2,'0');
  const ap = h < 12 ? 'am' : 'pm';
  h = h%12 === 0 ? 12 : h%12;
  return `${h}:${mm}${ap}`;
}

function addLog(text) {
  if (quiet) return;
  logs.unshift({ t: fmtTime(), text });
  if (logs.length > 30) logs.pop();
  document.getElementById('log').innerHTML =
    logs.map(l => `<li><span class="t">${l.t}</span><span>${l.text}</span></li>`).join('');
}

const cssVar = n => getComputedStyle(document.documentElement).getPropertyValue(n);
const barColor = v => v > 55 ? cssVar('--good') : v > 25 ? cssVar('--mid') : cssVar('--low');

const GOING = {
  sleep:'Heading to bed', eat:'Going to the table', cook:'Heading to the stove',
  snack:'Off to the fridge', toilet:'Hurrying to the bathroom', shower:'Going to shower',
  bath:'Running a bath', wash:'Going to the sink', tv:'Heading for the sofa', game:'Heading for the sofa',
  cards:'Getting the cards out', dance:'Heading for the record player', fish:'Going to see the fish',
  online:'Walking to the desk', relax:'Looking for a seat', chat:'Looking for company',
  read:'Fetching a book', paint:'Heading to the easel',
  guitar:'Going for the guitar', arcade:'Off to the arcade cabinet', stretch:'Heading for the mat',
};

let guestText = '';
function paintUI() {
  people.forEach((s, i) => {
    for (const n of NEEDS) {
      const el = document.getElementById(`b-${i}-${n.k}`);
      if (!el) return;
      el.style.width = s.needs[n.k] + '%';
      el.style.background = barColor(s.needs[n.k]);
    }
    const word = document.getElementById('mw-'+i);
    const act  = document.getElementById('act-'+i);
    if (!word) return;
    paintPortrait(i, s);
    word.textContent = moodOf(s).label;
    act.textContent =
      s.path.length && s.actKey ? (GOING[s.actKey] || 'On the move')
      : s.act ? s.act.verb : 'Deciding what to do';
  });
  document.getElementById('time').textContent = fmtTime();
  document.getElementById('day').textContent = 'Day ' + day;
  const rb = document.getElementById('relBar');
  rb.style.width = rel + '%';
  rb.style.background = barColor(rel);
  document.getElementById('relVal').textContent =
    family.partners ? 'Partners'
      : rel>82 ? 'Inseparable' : rel>60 ? 'Close' : rel>38 ? 'Friends'
      : rel>18 ? 'Warming up' : 'Strangers';
  const g = guests.length ? 'Visiting: ' + guests.map(p => `${p.name} (${p.friend.from})`).join(', ') : '';
  if (g !== guestText) { guestText = g; document.getElementById('guests').textContent = g; }
}

/* ---------- loop ---------- */

let last = performance.now();
function frame(now) {
  const dt = Math.min(0.1, (now - last)/1000);
  last = now;
  if (speed > 0) tick(dt * MIN_PER_SEC * speed);
  render(speed > 0 ? dt : 0);
  paintUI();
  requestAnimationFrame(frame);
}

/* ---------- saving and catching up ---------- */

// Visitors aren't saved: close the tab mid-visit and they've gone home by the time you're back.
let resetting = false;      // Start over deletes the save and reloads; unload must not write it back
function save() {
  if (resetting) return;
  try {
    localStorage.setItem(SAVE_KEY, JSON.stringify({
      v: 5, at: Date.now(), minutes, day, rel, wallMode, family, friends, lastVisit,
      people: people.map(s => ({
        name: s.name, gender: s.gender, traits: s.traitKeys, needs: s.needs,
        tx: s.tx, ty: s.ty, emotion: s.emotion, colors: s.colors,
      })),
    }));
  } catch (e) { /* storage unavailable — the sim still runs, it just won't persist */ }
}

// Time away runs far slower than live time: about one in-world day per real hour.
function catchUp(d) {
  const away = Math.min(MAX_AWAY, Math.max(0, (Date.now() - d.at) / 1000 * AWAY_MIN_PER_SEC));
  if (away < 30) return;
  quiet = true;
  for (let left = away; left > 0; left -= 4) tick(Math.min(4, left));
  quiet = false;
  const hrs = Math.round(away / 60);
  addLog(hrs >= 24
    ? `While you were away, ${Math.round(hrs/24)} day(s) passed here`
    : `While you were away, ${hrs} hour(s) passed here`);
}

document.querySelectorAll('.controls button[data-s]').forEach(b => {
  b.addEventListener('click', () => {
    speed = Number(b.dataset.s);
    document.querySelectorAll('.controls button[data-s]').forEach(o =>
      o.setAttribute('aria-pressed', String(o === b)));
  });
});

const wallBtn = document.getElementById('wallBtn');
if (saved && saved.wallMode) wallMode = saved.wallMode;
wallBtn.textContent = 'Walls: ' + wallMode;
wallBtn.addEventListener('click', () => {
  wallMode = wallMode === 'cutaway' ? 'full' : wallMode === 'full' ? 'off' : 'cutaway';
  wallBtn.textContent = 'Walls: ' + wallMode;
  save();
});

document.getElementById('resetBtn').addEventListener('click', () => {
  resetting = true;
  try { localStorage.removeItem(SAVE_KEY); } catch (e) {}
  location.reload();
});

setInterval(save, 5000);
window.addEventListener('beforeunload', save);
document.addEventListener('visibilitychange', () => { if (document.hidden) save(); });

window.addEventListener('resize', layout);
layout();
if (document.fonts && document.fonts.ready) document.fonts.ready.then(layout);   // the web font changes text heights
if (saved) { addLog('Back again'); catchUp(saved); }
else addLog('Everyone woke up');
for (const s of everyone()) if (!s.actKey && !s.leaving) think(s);
requestAnimationFrame(frame);
</script>
