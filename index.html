<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Little Life</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Pixelify+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root {
    --night:#131722; --panel:#1f2636; --panel-2:#2b3448; --line:#3b4763; --drop:#0a0d14;
    --ink:#f0eadc; --ink-dim:#a3adc2; --ink-faint:#737e96; --stage:#1a2030;
    --lamp:#f2c063; --lamp-edge:#b8862e; --good:#7cc4a4; --mid:#e3b45c; --low:#db6f61;
  }
  * { box-sizing:border-box; }
  body {
    margin:0; background:var(--night); color:var(--ink);
    font-family:"Pixelify Sans", ui-monospace, monospace;
  }
  .wrap { padding:10px 16px 12px; }

  /* chunky pixel panels: a 3px border with the corners notched out, and a hard drop */
  .px {
    background:var(--panel);
    box-shadow: 0 -3px 0 var(--line), 0 3px 0 var(--line), -3px 0 0 var(--line), 3px 0 0 var(--line),
                0 7px 0 var(--drop);
    margin:3px;
  }

  /* one row on desktop: title, controls, clock */
  .topbar { display:grid; grid-template-columns:auto minmax(0,1fr) auto; grid-template-areas:"title tools clock";
            align-items:center; gap:8px 24px; margin:0 3px 10px; }
  .title { grid-area:title; font-size:28px; font-weight:700; letter-spacing:.02em; color:var(--lamp);
           text-shadow:3px 3px 0 var(--drop); white-space:nowrap; }
  .clock { grid-area:clock; text-align:right; line-height:1.1; }
  .time { font-size:22px; font-weight:600; font-variant-numeric:tabular-nums; }
  .day { font-size:13px; color:var(--ink-dim); }

  .toolbar { grid-area:tools; display:flex; gap:4px 16px; justify-self:center; width:100%; max-width:720px; }
  .controls { display:flex; gap:6px; flex:1 1 0; }
  .controls button {
    flex:1; padding:5px 0 6px; background:var(--panel); color:var(--ink-dim); border:0;
    font-family:inherit; font-size:14px; cursor:pointer; white-space:nowrap;
    box-shadow: 0 -3px 0 var(--line), 0 3px 0 var(--line), -3px 0 0 var(--line), 3px 0 0 var(--line),
                0 6px 0 var(--drop);
    margin:3px 3px 6px;
  }
  .controls button:hover { color:var(--ink); }
  .controls button:active { transform:translateY(3px); box-shadow: 0 -3px 0 var(--line), 0 3px 0 var(--line),
                            -3px 0 0 var(--line), 3px 0 0 var(--line); }
  .controls button:focus-visible { outline:3px solid var(--lamp); outline-offset:3px; }
  .controls button[aria-pressed="true"] {
    background:var(--lamp); color:#2a2010;
    box-shadow: 0 -3px 0 var(--lamp-edge), 0 3px 0 var(--lamp-edge), -3px 0 0 var(--lamp-edge),
                3px 0 0 var(--lamp-edge), 0 6px 0 var(--drop);
  }

  .stage { background:var(--stage); overflow:hidden; margin-bottom:12px; display:flex; justify-content:center; }
  canvas#c { display:block; image-rendering:pixelated; image-rendering:crisp-edges; }
  canvas#c { image-rendering:pixelated; }

  /* stats strip: people on the left, the Together meter and log on the right */
  .below { display:grid; grid-template-columns:minmax(0,1fr) minmax(260px,320px); gap:14px 20px;
           grid-auto-rows:minmax(112px,auto); }
  /* visitors don't get cards — the household is always the same two people */
  #cards { display:grid; grid-template-columns:repeat(2, minmax(0, 1fr)); gap:14px 16px; align-content:start; }

  .card { padding:8px 10px 10px; container-type:inline-size; }
  .card-body { display:grid; gap:0 14px; }
  .card-head { display:flex; align-items:center; gap:9px; margin-bottom:4px; }
  .face { width:36px; height:36px; flex:none; image-rendering:pixelated; background:var(--panel-2); }
  .who { display:flex; flex-direction:column; min-width:0; line-height:1.15; }
  .nm { font-size:18px; font-weight:600; background:none; border:none; border-bottom:2px dashed transparent;
        color:var(--ink); font-family:inherit; padding:0; width:8ch; }
  .nm:hover, .nm:focus { border-bottom-color:var(--line); outline:none; }
  .sub { font-size:12.5px; color:var(--ink-dim); white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .traits { color:var(--ink-faint); }
  .act { font-size:14px; color:var(--lamp); margin:0 0 7px; min-height:1.2em;
         white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .needs { display:grid; grid-template-columns:1fr 1fr; gap:5px 14px; align-content:center; }
  .need-row { display:flex; align-items:center; gap:6px; font-size:13px; }
  .need-row .lbl { width:48px; color:var(--ink-dim); flex:none; }
  /* a wide card puts who they are beside how they're doing, so the strip stays short */
  @container (min-width:500px) {
    .card-body { grid-template-columns:190px minmax(0,1fr); align-items:center; }
    .act { margin:0; }
  }
  /* bars are segmented, like an old game's health meter */
  .bar { flex:1; height:8px; background:var(--panel-2); position:relative; overflow:hidden; min-width:0; }
  .bar i { display:block; height:100%; transition:width .3s linear, background .5s; }
  .bar::after { content:""; position:absolute; inset:0;
                background:repeating-linear-gradient(90deg, transparent 0 6px, var(--panel) 6px 8px); }

  /* The side panel never sets the row's height: contain:size gives it no height of its
     own, so it stretches to end level with the cards and the log scrolls inside that. */
  .side { padding:8px 12px 8px; contain:size; display:flex; flex-direction:column; }
  .rel { display:flex; align-items:center; gap:10px; font-size:14px; padding-bottom:8px;
         border-bottom:2px solid var(--panel-2); margin-bottom:6px; }
  .rel .lbl { color:var(--ink-dim); flex:none; }
  .rel .val { color:var(--ink); flex:none; min-width:9ch; text-align:right; }
  .guests { font-size:13px; color:var(--lamp); margin:-2px 0 6px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .guests:empty { display:none; }
  h2 { font-size:13px; font-weight:500; color:var(--ink-faint); margin:0 0 2px; }
  .log { list-style:none; margin:0; padding:0; font-size:13.5px; flex:1; min-height:0; overflow-y:auto;
         scrollbar-width:thin; scrollbar-color:var(--line) transparent; }
  .log li { display:flex; gap:10px; padding:4px 0; border-bottom:2px solid var(--panel-2); color:var(--ink-dim); }
  .log li:last-child { border-bottom:0; }
  .log li:first-child { color:var(--ink); }
  .log .t { font-variant-numeric:tabular-nums; color:var(--ink-faint); flex:none; width:6.4ch; }

  /* tablet: controls get their own row, stats stack under the room */
  @media (max-width:900px) {
    .topbar { grid-template-columns:1fr auto; grid-template-areas:"title clock" "tools tools"; }
    .toolbar { max-width:none; }
    .below { grid-template-columns:1fr; grid-auto-rows:auto; }
    #cards { grid-template-columns:repeat(2, minmax(0, 1fr)); }
    .side { height:190px; }
  }
  /* phone: tighter gutters, and the two button groups stack */
  @media (max-width:560px) {
    .wrap { padding:8px 8px 16px; }
    .title { font-size:22px; }
    .time { font-size:18px; }
    .toolbar { flex-direction:column; }
    .controls button { font-size:13px; }
    #cards { grid-template-columns:1fr; }
    .side { height:240px; }
  }
</style>

<div class="wrap" id="wrap">
  <header class="topbar">
    <span class="title">Little Life</span>
    <div class="toolbar">
      <div class="controls" role="group" aria-label="Speed">
        <button data-s="0">Pause</button>
        <button data-s="1" aria-pressed="true">1×</button>
        <button data-s="4">4×</button>
        <button data-s="12">12×</button>
      </div>
      <div class="controls">
        <button id="wallBtn">Walls: cutaway</button>
        <button id="resetBtn">Start over</button>
      </div>
    </div>
    <div class="clock">
      <div class="time" id="time">7:00am</div>
      <div class="day" id="day">Day 1</div>
    </div>
  </header>

  <div class="stage px"><canvas id="c"></canvas></div>

  <div class="below">
    <div id="cards"></div>
    <div class="side px">
      <div class="rel">
        <span class="lbl">Together</span>
        <span class="bar"><i id="relBar"></i></span>
        <span class="val" id="relVal">Strangers</span>
      </div>
      <div class="guests" id="guests"></div>
      <h2>What happened</h2>
      <ul class="log" id="log"></ul>
    </div>
  </div>
</div>

<script>
const COLS = 10, ROWS = 10;

const NEEDS = [
  { k:'energy',  label:'Energy',  decay:5.2, weight:1.15 },
  { k:'hunger',  label:'Hunger',  decay:6.4, weight:1.20 },
  { k:'bladder', label:'Bladder', decay:7.8, weight:1.40 },
  { k:'hygiene', label:'Clean',   decay:4.0, weight:0.85 },
  { k:'fun',     label:'Fun',     decay:5.6, weight:0.80 },
  { k:'social',  label:'Social',  decay:3.6, weight:0.70 },
];
const NEED = k => NEEDS.find(n => n.k === k);

/* Traits shift decay rates, need weights, and a few behaviour knobs.
   Two per Sim, drawn at start, never opposites. */
const TRAITS = {
  neat:      { name:'neat',       weight:{hygiene:1.7}, decay:{hygiene:1.2} },
  slob:      { name:'slob',       weight:{hygiene:0.45} },
  glutton:   { name:'glutton',    decay:{hunger:1.4} },
  nightOwl:  { name:'night owl',  shift: 2.5 },
  earlyBird: { name:'early bird', shift:-2.0 },
  sociable:  { name:'sociable',   weight:{social:1.7}, decay:{social:1.3}, chat:1.5 },
  loner:     { name:'loner',      weight:{social:0.5}, chat:0.35 },
  lazy:      { name:'lazy',       decay:{energy:1.3}, idle:2.2 },
  playful:   { name:'playful',    weight:{fun:1.5}, decay:{fun:1.2} },
  bookish:   { name:'bookish',    weight:{fun:0.75}, chat:0.75 },
};

/* `kind` shares one drawing between several objects. `use` lists the tiles (relative to
   the object) someone must stand on to use it — without it any neighbouring tile will
   do, which is how people ended up playing the arcade from the side of the cabinet. */
const OBJECTS = [
  // bedroom — beds run away from the head wall, nightstand between them
  { id:'bed0',   kind:'bed', x:1, y:0, w:1, h:2, color:'#9891e0', cap:1 },
  { id:'bed1',   kind:'bed', x:3, y:0, w:1, h:2, color:'#7fc0e0', cap:1 },
  { id:'stand',  x:2, y:0, w:1, h:1, color:'#7a5a3e', cap:9 },
  { id:'plant2', kind:'plant', x:0, y:0, w:1, h:1, color:'#4e8f5a', cap:9 },
  { id:'wardrobe', x:5, y:0, w:1, h:1, color:'#8a6a4a', cap:9 },
  { id:'desk',   x:0, y:1, w:1, h:1, color:'#8a6a4a', cap:1 },
  { id:'mat',    x:2, y:3, w:1, h:1, color:'#7fb5a8', cap:1 },

  // bathroom — plumbing along the back wall, the tub under the window
  { id:'shower', x:6, y:0, w:1, h:1, color:'#a6e4ea', cap:1 },
  { id:'sink',   x:7, y:0, w:1, h:1, color:'#cdeadf', cap:1 },
  { id:'toilet', x:8, y:0, w:1, h:1, color:'#fdf3e2', cap:1 },
  { id:'tub',    x:9, y:0, w:1, h:2, color:'#f4f0e8', cap:1 },

  // kitchen down the west wall; the dining table's footprint includes its four chairs,
  // so nobody walks through them
  { id:'fridge', x:0, y:4, w:1, h:1, color:'#d7d7cb', cap:1 },
  { id:'stove',  x:0, y:5, w:1, h:1, color:'#8b8b84', cap:1 },
  { id:'counter',x:0, y:6, w:1, h:1, color:'#b9b3a4', cap:9 },
  { id:'table',  x:2, y:5, w:2, h:3, color:'#a8763e', cap:4 },

  // entry — the front door is on the west wall at y 8; tile (0,8) stays clear for it
  { id:'bench',  x:0, y:9, w:1, h:1, color:'#a8744a', cap:1 },
  { id:'easel',  x:2, y:9, w:1, h:1, color:'#cbb089', cap:1, use:[[1,0]] },
  { id:'guitar', x:4, y:9, w:1, h:1, color:'#c98a3e', cap:1 },

  // living — every seat faces south, toward the TV and the camera, so sitters show their faces
  { id:'tank',   x:5, y:4, w:1, h:1, color:'#6fc3d8', cap:1, use:[[0,1]] },
  { id:'arcade', x:6, y:4, w:1, h:1, color:'#4a6fa5', cap:1, use:[[0,1]] },
    { id:'shelf',  x:9, y:4, w:1, h:1, color:'#8a5a3c', cap:9 },
  { id:'chair0', kind:'armchair', x:5, y:6, w:1, h:1, color:'#7fb5a8', cap:1 },
  { id:'sofa',   x:6, y:6, w:2, h:1, color:'#ff9c74', cap:2 },
  { id:'chair1', kind:'armchair', x:8, y:6, w:1, h:1, color:'#7fb5a8', cap:1 },
  { id:'lamp',   x:9, y:6, w:1, h:1, color:'#e0b457', cap:9 },
  { id:'record', x:9, y:8, w:1, h:1, color:'#7a5a3e', cap:2, use:[[-1,1],[0,1]] },   // room for two to dance, in front of it
  { id:'tv',     x:6, y:9, w:2, h:1, color:'#5c6486', cap:9 },
  { id:'plant',  x:5, y:9, w:1, h:1, color:'#4e8f5a', cap:9 },
];
const byId = id => OBJECTS.find(o => o.id === id);
const SEATS = ['sofa', 'chair0', 'chair1', 'bench'];

/* guest: visitors may do it too. group: better with company — joining someone already
   at it scores higher, and doing it together tops up social. clash: can't share the
   object with that activity (one TV, one screen). */
const ACTS = {
  sleep:  { obj:s=>s.bedId,   need:'energy',  rate:0.30, cap:99, verb:'Sleeping',           log:'went to bed' },
  eat:    { obj:()=>'table',  need:'hunger',  rate:3.40, cap:98, verb:'Eating',             log:'sat down to eat' },
  cook:   { obj:()=>'stove',  fixed:22,                          verb:'Cooking',            log:'started cooking', then:'eat' },
  snack:  { obj:()=>'fridge', need:'hunger',  rate:4.50, cap:52, verb:'Raiding the fridge', log:'grabbed a snack', guest:true },
  toilet: { obj:()=>'toilet', need:'bladder', rate:11.0, cap:99, verb:'In the bathroom',    log:'went to the bathroom' },
  shower: { obj:()=>'shower', need:'hygiene', rate:5.00, cap:98, verb:'Taking a shower',    log:'got in the shower' },
  bath:   { obj:()=>'tub',    need:'hygiene', rate:3.20, cap:99, verb:'Soaking in the tub', log:'ran a bath', variety:true,
            gains:{ fun:0.8 }, likes:'lazy' },
  wash:   { obj:()=>'sink',   need:'hygiene', rate:7.00, cap:55, verb:'Washing up',         log:'washed up' },
  // Hobbies run for a session (in-world minutes, give or take) rather than until fun is
  // full: fun tops up in a few minutes, and people were bouncing between hobbies every
  // couple of seconds, or skipping them for the sofa.
  tv:     { obj:()=>'sofa',   need:'fun',     rate:2.60, session:45, verb:'Watching TV',        log:'put the TV on', variety:true,
            likes:'lazy', guest:true, group:true, join:'in front of the TV', clash:'game' },
  game:   { obj:()=>'sofa',   need:'fun',     rate:3.20, session:45, verb:'Playing video games', log:'grabbed a controller', variety:true,
            likes:'playful', guest:true, group:true, join:'for a game', clash:'tv' },
  cards:  { obj:()=>'table',  need:'fun',     rate:2.40, session:40, verb:'Playing cards',      log:'dealt a hand of solitaire', variety:true,
            guest:true, group:true, join:'for cards' },
  dance:  { obj:()=>'record', need:'fun',     rate:3.00, session:25, verb:'Dancing',            log:'put a record on', variety:true,
            costs:{ energy:0.10, hygiene:0.25 }, likes:'sociable', guest:true, group:true, join:'dancing' },
  fish:   { obj:()=>'tank',   need:'fun',     rate:1.50, session:20, verb:'Watching the fish',  log:'went to look at the fish', variety:true,
            likes:'loner', guest:true },
  read:   { obj:()=>'chair1', need:'fun',     rate:2.20, session:50, verb:'Reading',            log:'curled up with a book', variety:true, likes:'bookish' },
  paint:  { obj:()=>'easel',  need:'fun',     rate:2.40, session:45, verb:'Painting',           log:'started painting', variety:true },
  guitar: { obj:()=>'guitar', need:'fun',     rate:3.00, session:35, verb:'Playing guitar',     log:'picked up the guitar', variety:true, likes:'playful' },
  arcade: { obj:()=>'arcade', need:'fun',     rate:3.60, session:30, verb:'Playing the arcade', log:'fired up the arcade cabinet', variety:true,
            likes:'playful', guest:true },
  stretch:{ obj:()=>'mat',    need:'fun',     rate:1.90, session:25, verb:'Stretching',         log:'unrolled the mat', variety:true,
            costs:{ hygiene:0.40 }, gains:{ energy:0.35 } },
  online: { obj:()=>'desk',   need:'social',  rate:2.20, cap:80, verb:'Messaging friends',  log:'sat down at the desk', variety:true },
  relax:  { obj:s=>(s.actKey === 'relax' && s.held) || nearestSeat(s),
            need:'fun',     rate:0.70, cap:58, verb:'Sitting around',     log:'sat down for a bit', idle:true, variety:true, guest:true },
  chat:   { social:true,                                         verb:'Chatting', guest:true },
};

/* Walls. 'N:x:y' sits on the north edge of tile (x,y), 'W:x:y' on its west edge.
   Depth here is gx+gy, so a wall only hides things when its own coordinate is
   above zero — which is exactly the set cutaway mode knocks down. */
const walls = new Set();
for (let x = 0; x < COLS; x++) walls.add(`N:${x}:0`);
for (let y = 0; y < ROWS; y++) walls.add(`W:0:${y}`);
for (let x = 0; x < COLS; x++) if (x !== 4 && x !== 7) walls.add(`N:${x}:4`);
for (let y = 0; y < 4; y++) if (y !== 2) walls.add(`W:6:${y}`);
// The front door is painted onto the west wall rather than cut through it: the street
// isn't part of the map, so visitors appear on the doormat and leave from it.
const DOOR = [0, 8];
const DOORWAYS = ['4,3', '4,4', '7,3', '7,4', '5,2', '6,2', '0,8'];

let wallMode = 'cutaway';

const blocked = Array.from({ length: COLS }, () => Array(ROWS).fill(false));
for (const o of OBJECTS)
  for (let i = 0; i < o.w; i++)
    for (let j = 0; j < o.h; j++) blocked[o.x + i][o.y + j] = true;

const inBounds = (x,y) => x>=0 && y>=0 && x<COLS && y<ROWS;
const free = (x,y) => inBounds(x,y) && !blocked[x][y];

function canCross(fx, fy, tx, ty) {
  if (ty === fy + 1) return !walls.has(`N:${tx}:${ty}`);
  if (ty === fy - 1) return !walls.has(`N:${fx}:${fy}`);
  if (tx === fx + 1) return !walls.has(`W:${tx}:${ty}`);
  if (tx === fx - 1) return !walls.has(`W:${fx}:${fy}`);
  return true;
}

function approachTiles(o) {
  if (o.use) return o.use.map(([dx, dy]) => [o.x + dx, o.y + dy]).filter(([x, y]) => free(x, y));
  const out = [], seen = new Set();
  for (let i = 0; i < o.w; i++)
    for (let j = 0; j < o.h; j++) {
      const ox = o.x + i, oy = o.y + j;
      for (const [dx, dy] of [[1,0],[-1,0],[0,1],[0,-1]]) {
        const x = ox + dx, y = oy + dy, k = x + ',' + y;
        // must be walkable AND not on the far side of a wall from the object
        if (!free(x, y) || seen.has(k) || !canCross(x, y, ox, oy)) continue;
        seen.add(k); out.push([x, y]);
      }
    }
  return out;
}

function neighbourTiles(tx, ty) {
  const out = [];
  for (const [dx,dy] of [[0,0],[1,0],[-1,0],[0,1],[0,-1]]) {
    const x = Math.round(tx)+dx, y = Math.round(ty)+dy;
    if (free(x,y)) out.push([x,y]);
  }
  return out;
}

function findPath(sx, sy, goals) {
  sx = Math.round(sx); sy = Math.round(sy);
  const key = (x,y) => x*ROWS + y;
  const goalSet = new Set(goals.map(g => key(g[0], g[1])));
  if (!goalSet.size) return null;
  if (goalSet.has(key(sx,sy))) return [];
  const prev = new Map([[key(sx,sy), null]]);
  const q = [[sx,sy]];
  while (q.length) {
    const [x,y] = q.shift();
    for (const [dx,dy] of [[1,0],[-1,0],[0,1],[0,-1]]) {
      const nx = x+dx, ny = y+dy, k = key(nx,ny);
      if (!free(nx,ny) || prev.has(k) || !canCross(x,y,nx,ny)) continue;
      prev.set(k, [x,y]);
      if (goalSet.has(k)) {
        const path = []; let cur = [nx,ny];
        while (cur) { path.push(cur); cur = prev.get(key(cur[0],cur[1])); }
        return path.reverse().slice(1);
      }
      q.push([nx,ny]);
    }
  }
  return null;
}

/* ---------- sims ---------- */

const MALE_NAMES = ['Arlo','Bo','Cass','Dex','Emmet','Finn','Gus','Hugo','Ira','Jonah',
                    'Kit','Levi','Milo','Nash','Otis','Rafe','Silas','Theo','Vance','Wyatt'];
const FEMALE_NAMES = ['Ada','Bea','Cleo','Dot','Elsie','Fern','Greta','Hazel','Iris','Juno',
                      'Kira','Lark','Maeve','Nell','Opal','Pearl','Romy','Sage','Thea','Wren'];
const pick = a => a[Math.floor(Math.random()*a.length)];
const randomName = g => pick(g === 'm' ? MALE_NAMES : FEMALE_NAMES);

function makeSim(i, name, gender, traitKeys, colors, opts = {}) {
  const needs = {};
  for (const n of NEEDS) needs[n.k] = 45 + Math.random()*30;
  traitKeys = (traitKeys || []).filter(k => TRAITS[k]);
  if (!traitKeys.length) traitKeys = drawTraits();
  const traits = traitKeys.map(k => TRAITS[k]);
  const decayMul = {}, weightMul = {};
  for (const n of NEEDS) { decayMul[n.k] = 1; weightMul[n.k] = 1; }
  let shift = 0, chatMul = 1, idleMul = 1;
  for (const t of traits) {
    for (const k in (t.decay || {})) decayMul[k] *= t.decay[k];
    for (const k in (t.weight || {})) weightMul[k] *= t.weight[k];
    shift += t.shift || 0;
    chatMul *= t.chat || 1;
    idleMul *= t.idle || 1;
  }
  return { i, name, gender, needs, traits, traitKeys, decayMul, weightMul, shift, chatMul, idleMul,
           colors, tx: opts.tx ?? (4 + i), ty: opts.ty ?? 7, path: [], act: null, actKey: null,
           timer: 0, bob: 0, held: null, seat: null, emotion: null,
           recent: {}, dirx: 1, diry: 0, chatTarget: null,
           stage: opts.stage || 'adult', bedId: 'bed' + i };
}

const OPPOSITE = { neat:'slob', slob:'neat', sociable:'loner', loner:'sociable',
                   nightOwl:'earlyBird', earlyBird:'nightOwl' };
const pool = Object.keys(TRAITS);
function drawTraits() {
  const a = pool[Math.floor(Math.random()*pool.length)];
  let b = a;
  while (b === a || OPPOSITE[a] === b) b = pool[Math.floor(Math.random()*pool.length)];
  return [a, b];
}

const SHIRTS = ['#e0a35c','#7fb5a8','#c4645a','#6c8bd0','#c9a3d6','#8fbf6a'];
const PANTS  = ['#3f4a6b','#4d3f36','#2f3a4a','#4b5d4a','#5a4a6a','#6a5040'];
const SKINS  = ['#e8b892','#c98f68','#a9714c','#f0c8a8','#8d5a3b'];
const HAIRS  = ['#4a3a30','#241c18','#6b4423','#8d6a4a','#2b2b33','#a3743c'];
function paletteFor(gender, i) {
  return {
    shirt: SHIRTS[(i + (gender === 'f' ? 1 : 0)) % SHIRTS.length],
    skin:  pick(SKINS),
    hair:  pick(HAIRS),
    pants: PANTS[(i * 2 + (gender === 'f' ? 1 : 0)) % PANTS.length],
  };
}

const SAVE_KEY = 'little-life-save';
const AWAY_MIN_PER_SEC = 0.4;      // roughly one real hour per in-world day
const MAX_AWAY = 1440 * 7;         // never fast-forward more than a week
let quiet = false;                 // suppresses the log during catch-up

function loadSave() {
  try {
    const raw = localStorage.getItem(SAVE_KEY);
    if (!raw) return null;
    const d = JSON.parse(raw);
    if (!d || (d.v !== 4 && d.v !== 5) || !Array.isArray(d.people)) return null;
    // v4 households could include children; v5 is just the two adults who live here
    d.people = d.people.filter(p => !p.stage || p.stage === 'adult').slice(0, 2);
    return d.people.length === 2 ? d : null;
  } catch (e) { return null; }
}

const saved = loadSave();

function restorePerson(d, i) {
  const g = d.gender || (i ? 'f' : 'm');
  // furniture moves between versions, so a saved spot can now be inside a sofa
  const ok = Number.isFinite(d.tx) && Number.isFinite(d.ty) && free(Math.round(d.tx), Math.round(d.ty));
  const s = makeSim(i, d.name || randomName(g), g, d.traits,
                    Object.assign(paletteFor(g, i), d.colors || {}),
                    ok ? { tx:d.tx, ty:d.ty } : {});
  for (const n of NEEDS)
    if (typeof d.needs?.[n.k] === 'number') s.needs[n.k] = d.needs[n.k];
  s.emotion = d.emotion || null;
  return s;
}

function newHousehold() {
  return [
    makeSim(0, randomName('m'), 'm', drawTraits(), paletteFor('m', 0)),
    makeSim(1, randomName('f'), 'f', drawTraits(), paletteFor('f', 1)),
  ];
}

const people = saved ? saved.people.map(restorePerson) : newHousehold();

let rel = saved ? saved.rel : 12;
const family = { partners: !!(saved && saved.family && saved.family.partners) };

/* ---------- friends and neighbours ----------
   A fixed circle of four, made once per household and saved, so the same faces keep
   coming round. Visitors run the same brain with a shorter list of things to do. */
const FROM = ['from next door', 'from upstairs', 'from across the hall', 'from work', 'from the café'];
function makeFriends() {
  const used = new Set(people.map(p => p.name));
  return FROM.slice().sort(() => Math.random() - 0.5).slice(0, 4).map((from, k) => {
    const g = Math.random() < 0.5 ? 'm' : 'f';
    let name = randomName(g);
    while (used.has(name)) name = randomName(g);
    used.add(name);
    return { name, gender: g, traits: drawTraits(), colors: paletteFor(g, k + 2), from };
  });
}
const friends = saved && Array.isArray(saved.friends) && saved.friends.length ? saved.friends : makeFriends();
const guests = [];
let lastVisit = saved ? (saved.lastVisit ?? -1e9) : -1e9;
const everyone = () => guests.length ? people.concat(guests) : people;

function makeGuest(f, k) {
  const s = makeSim(10 + k, f.name, f.gender, f.traits, f.colors, { stage:'guest', tx:DOOR[0], ty:DOOR[1] });
  // they've come round to hang out: they ate, washed and slept at home
  for (const n of ['energy', 'bladder', 'hygiene']) { s.needs[n] = 100; s.decayMul[n] = 0; }
  s.needs.hunger = 70 + Math.random() * 25;
  s.needs.fun = 25 + Math.random() * 30;
  s.needs.social = 20 + Math.random() * 30;
  s.friend = f;
  s.leaveAt = minutes + 100 + Math.random() * 110;
  return s;
}

/* conversations: several can run at once now there can be four people in the flat */
const convs = [];
const convOf = s => convs.find(c => c.a === s || c.b === s) || null;
const residents = c => c.a.stage === 'adult' && c.b.stage === 'adult';

let minutes = saved ? saved.minutes : 7*60;
let day = saved ? saved.day : 1;
let speed = 1;

/* ---------- mood ----------
   Needs decide what's possible; mood nudges how appealing each option feels,
   and two of these moods make a conversation likely to go badly. */
const MOODS = {
  happy:        { label:'happy',        emoji:'😄', sleep:0,  chat:  6, argue:-0.12 },
  content:      { label:'content',      emoji:'🙂', sleep:0,  chat:  0, argue: 0.00 },
  tired:        { label:'tired',        emoji:'🥱', sleep:18, chat: -8, argue: 0.10 },
  grumpy:       { label:'grumpy',       emoji:'😠', sleep:0,  chat: -6, argue: 0.26 },
  lonely:       { label:'lonely',       emoji:'😔', sleep:0,  chat: 16, argue: 0.04 },
  annoyed:      { label:'annoyed',      emoji:'😤', sleep:0,  chat:-14, argue: 0.30 },
  affectionate: { label:'affectionate', emoji:'🥰', sleep:0,  chat: 14, argue:-0.25 },
};

function moodOf(s) {
  if (s.emotion && minutes < s.emotion.until && MOODS[s.emotion.key])
    return MOODS[s.emotion.key];
  const phys = (s.needs.energy + s.needs.hunger + s.needs.bladder + s.needs.hygiene) / 4;
  const soc  = (s.needs.fun + s.needs.social) / 2;
  if (s.needs.energy < 28) return MOODS.tired;
  if (phys < 38) return MOODS.grumpy;
  if (s.needs.social < 25) return MOODS.lonely;
  if (phys > 72 && soc > 68) return MOODS.happy;
  return MOODS.content;
}

function setEmotion(s, key, mins) { s.emotion = { key, until: minutes + mins }; }
const MIN_PER_SEC = 4;
const logs = [];

/* ---------- brain ---------- */

const hour = () => (minutes/60) % 24;
function nightFor(s) {
  const h = hour(), start = 22.5 + s.shift, end = 6.5 + s.shift;
  return start < 24 ? (h >= start || h < end) : (h >= start - 24 && h < end);
}

function taken(objId, self) {
  const o = byId(objId);
  return everyone().filter(s => s !== self && s.held === objId).length >= o.cap;
}
// someone else is on the object doing something that can't share it (TV vs. video games)
function clashes(key, s) {
  const a = ACTS[key];
  return !!a.clash && everyone().some(p => p !== s && p.held === a.obj(s) && p.actKey === a.clash);
}
// everyone else who's already arrived and doing this
const doingWith = (key, s) => everyone().filter(p => p !== s && p.actKey === key && p.held && !p.path.length);

function nearestSeat(s) {
  let best = 'sofa', bestD = 1e9;
  for (const id of SEATS) {
    if (taken(id, s)) continue;
    const o = byId(id), d = Math.abs(o.x - s.tx) + Math.abs(o.y - s.ty);
    if (d < bestD) { bestD = d; best = id; }
  }
  return best;
}

// who they'd talk to: whoever they're already talking to, otherwise partnerFor's pick
const talkTo = s => (convOf(s) && s.chatTarget) || partnerFor(s);

function urgency(key, s) {
  const a = ACTS[key];
  const m = moodOf(s);
  if (a.social) {
    const other = talkTo(s);
    if (!other) return 0;
    const pair = s.stage === 'adult' && other.stage === 'adult';
    let u = Math.pow(1 - s.needs.social/100, 2) * 100 * NEED('social').weight * s.weightMul.social;
    // company's over: catching up with a visitor beats another chat with the flatmate
    const visit = s.stage !== other.stage ? 14 : 0;
    // mood only pulls toward talking while there's some appetite for it — otherwise an
    // affectionate couple, fully caught up, chatted all day instead of doing anything else
    const pull = m.chat * Math.min(1, (100 - s.needs.social) / 40);
    return Math.max(0, u * s.chatMul * (pair ? 0.6 + rel/140 : 0.9) + pull + visit);
  }
  if (a.idle) {
    let u = 5 * s.idleMul;
    if (minutes - (s.recent[key] ?? -1e9) < 200) u -= 7;
    return u;
  }
  if (key === 'cook' || key === 'eat') {
    // without this, someone full at the table re-picks eating every tick, since it ends the moment it starts
    if (s.needs.hunger >= ACTS.eat.cap - 1) return -Infinity;
    return Math.pow(1 - s.needs.hunger/100, 2) * 100 * 1.20 * s.weightMul.hunger * 1.05;
  }

  // Nothing to gain means not a candidate at all. At 0 it could still win when nothing
  // else was needed either — the nearest full need came out on top, and someone sat on
  // the toilet at 100% bladder for an hour because they happened to be next to it.
  const v = s.needs[a.need];
  // ...except sleep at night: rested or not, you stay in bed till morning — otherwise they
  // got up at 98% energy, found it was still night, and went back to bed every few minutes
  const bedtime = key === 'sleep' && nightFor(s);
  if (!a.session && !bedtime && v >= a.cap - 1) return -Infinity;
  let u = Math.pow(1 - v/100, 2) * 100 * NEED(a.need).weight * s.weightMul[a.need];
  // hobbies are what free time is for: open even when fun is full, and ahead of sitting around
  if (a.session) u = Math.max(u, LEISURE);
  // a nap takes real tiredness now that a night's sleep lasts till morning
  if (key === 'sleep') u += (nightFor(s) ? 30 : -28) + m.sleep;
  if (key === 'snack') u *= 0.72;
  if (key === 'wash') u *= 0.6;
  if (key === 'bath') u *= 0.8;           // a soak is a treat, not the usual way to get clean
  if (a.likes && s.traitKeys.includes(a.likes)) u += 15;
  // joining in beats starting something alone — this is what gets a game of cards going
  if (a.group && doingWith(key, s).length) u += 16;
  // doing the same thing again soon after is less appealing than trying something else
  // (but not the thing they're in the middle of, or they'd talk themselves out of it)
  if (a.variety && key !== s.actKey && minutes - (s.recent[key] ?? -1e9) < 260) u -= 26;
  return u;
}
const LEISURE = 10;

function distanceTo(key, s) {
  if (ACTS[key].social) {
    const o = s.chatTarget || partnerFor(s);
    if (!o) return 99;
    return Math.abs(o.tx - s.tx) + Math.abs(o.ty - s.ty);
  }
  const o = byId(ACTS[key].obj(s));
  return Math.abs(o.x - s.tx) + Math.abs(o.y - s.ty);
}

function targetTiles(key, s) {
  if (ACTS[key].social) {
    const o = s.chatTarget || partnerFor(s);
    return o ? neighbourTiles(o.tx, o.ty) : [];
  }
  const o = byId(ACTS[key].obj(s)), tiles = approachTiles(o);
  // leave the spots other users are standing on (or heading for) — two dancers, two tiles
  const mine = new Set(everyone().filter(p => p !== s && p.held === o.id).map(p => {
    const t = p.path.length ? p.path[p.path.length - 1] : [Math.round(p.tx), Math.round(p.ty)];
    return t[0] + ',' + t[1];
  }));
  const open = tiles.filter(t => !mine.has(t[0] + ',' + t[1]));
  return open.length ? open : tiles;
}

function bestAction(s) {
  let best = 'relax', bestScore = -Infinity;
  for (const key of Object.keys(ACTS)) {
    const a = ACTS[key];
    if (s.stage === 'guest' && !a.guest) continue;
    if (!a.social && (taken(a.obj(s), s) || clashes(key, s))) continue;
    const score = urgency(key, s) - distanceTo(key, s) * 1.0;
    if (score > bestScore) { bestScore = score; best = key; }
  }
  return { key: best, score: bestScore };
}

function endAct(s) { s.act = null; s.actKey = null; s.held = null; s.seat = null; s.path = []; }

function startAct(key, s) {
  const a = ACTS[key];
  s.actKey = key; s.act = a;
  s.recent[key] = minutes;
  s.timer = a.fixed || (a.session ? a.session * (0.7 + Math.random() * 0.6) : 0);
  if (a.social) s.chatTarget = partnerFor(s);
  s.held = a.social ? null : a.obj(s);
  s.path = findPath(s.tx, s.ty, targetTiles(key, s)) || [];
  if (a.log) {
    const others = a.group ? doingWith(key, s) : [];
    addLog(others.length ? `${s.name} joined ${others[0].name} ${a.join}` : `${s.name} ${a.log}`);
  }
}

function endConv(c, natural) {
  const i = convs.indexOf(c);
  if (i < 0) return;
  convs.splice(i, 1);
  for (const s of [c.a, c.b]) if (s.actKey === 'chat') endAct(s);
  if (!natural) return;
  const home = residents(c);
  if (c.mode === 'argue') {
    for (const s of [c.a, c.b]) setEmotion(s, 'annoyed', 110);
    addLog(`${c.a.name} and ${c.b.name}'s argument fizzled out`);
    return;
  }
  if (home && rel > 52) for (const s of [c.a, c.b]) setEmotion(s, 'affectionate', 150);
  if (home && !family.partners && rel >= 84) {
    family.partners = true;
    addLog(`${c.a.name} and ${c.b.name} are a couple now`);
  } else {
    addLog(`${c.a.name} and ${c.b.name} wrapped up their conversation`);
  }
}

function think(s) {
  const { key, score } = bestAction(s);
  if (!s.actKey) { startAct(key, s); return; }
  if (key === s.actKey) return;
  const cur = urgency(s.actKey, s) - distanceTo(s.actKey, s) * 1.0;
  const c = convOf(s);
  const margin = s.actKey === 'sleep' ? 62 : c ? 42 : 26;
  if (score - cur > margin) {
    if (c) endConv(c, false);
    startAct(key, s);
  }
}

const gone = p => !p || p.leaving || !everyone().includes(p);

function tryChat(s) {
  const other = s.chatTarget;
  if (gone(other)) { endAct(s); return; }
  const busy = convOf(other) || (other.actKey && other.actKey !== 'chat' && urgency(other.actKey, other) > 45);
  if (other.actKey === 'sleep' || busy) {
    addLog(`${s.name} couldn't get ${other.name}'s attention`);
    endAct(s);
    s.needs.social = Math.max(0, s.needs.social - 3);
    setEmotion(s, 'annoyed', 40);
    return;
  }
  if (other.actKey !== 'chat') { endAct(other); other.actKey = 'chat'; other.act = ACTS.chat; }
  other.chatTarget = s;

  // whether this goes well depends on how both of them feel and where they stand
  const home = s.stage === 'adult' && other.stage === 'adult';
  const relPull = !home ? 0 : rel < 30 ? 0.12 : rel > 70 ? -0.15 : 0;
  let p = Math.min(0.7, Math.max(0, 0.06 + moodOf(s).argue + moodOf(other).argue + relPull));
  if (home && family.partners) p *= 0.5;
  if (!home) p *= 0.4;                     // everyone minds their manners with company
  const c = { a: s, b: other, mode: Math.random() < p ? 'argue' : 'chat' };
  c.timer = c.mode === 'argue' ? 14 : 34;
  convs.push(c);
  addLog(c.mode === 'argue'
    ? `${s.name} and ${other.name} started bickering`
    : `${s.name} and ${other.name} got talking`);
}

/* ---------- tick ---------- */

function moveAlong(s, dtMin) {
  let move = 1.6 * dtMin;
  while (move > 0 && s.path.length) {
    const [gx, gy] = s.path[0];
    const dx = gx - s.tx, dy = gy - s.ty, d = Math.hypot(dx, dy);
    if (d > 0.001) { s.dirx = dx/d; s.diry = dy/d; }
    if (d <= move) { s.tx = gx; s.ty = gy; s.path.shift(); move -= d; }
    else { s.tx += dx/d*move; s.ty += dy/d*move; move = 0; }
  }
  s.bob += dtMin * 2.4;
}

function stepSim(s, dtMin) {
  for (const n of NEEDS)
    s.needs[n.k] = Math.max(0, s.needs[n.k] - n.decay * s.decayMul[n.k] * dtMin / 60);

  if (s.leaving) { moveAlong(s, dtMin); return; }        // a visitor heading for the door
  if (s.path.length) { moveAlong(s, dtMin); think(s); return; }

  const a = s.act;
  if (!a) { think(s); return; }

  if (a.social) {
    if (convOf(s)) return;                     // gains handled in stepConvs
    const other = s.chatTarget;
    if (gone(other)) { endAct(s); return; }
    const near = Math.abs(other.tx - s.tx) + Math.abs(other.ty - s.ty) <= 1.6;
    if (near) tryChat(s);
    else {
      s.path = findPath(s.tx, s.ty, neighbourTiles(other.tx, other.ty)) || [];
      if (!s.path.length) endAct(s);
    }
    return;
  }

  if (a.fixed) {
    s.timer -= dtMin;
    if (s.timer <= 0) { if (a.then) startAct(a.then, s); else endAct(s); }
    return;
  }

  s.needs[a.need] = Math.min(100, s.needs[a.need] + a.rate * dtMin);
  for (const k in (a.costs || {})) s.needs[k] = Math.max(0, s.needs[k] - a.costs[k] * dtMin);
  for (const k in (a.gains || {})) s.needs[k] = Math.min(100, s.needs[k] + a.gains[k] * dtMin);
  // doing it together counts as time together — and the two who live here grow closer
  // over it, if more slowly than by talking (this runs once for each of them)
  const with_ = a.group ? doingWith(s.actKey, s) : [];
  if (with_.length) {
    s.needs.social = Math.min(100, s.needs.social + 0.25 * dtMin);
    if (s.stage === 'adult' && with_.some(p => p.stage === 'adult')) rel = Math.min(100, rel + 0.02 * dtMin);
  }
  if (a.session) { if ((s.timer -= dtMin) <= 0) endAct(s); }
  else if (s.needs[a.need] >= a.cap && !(s.actKey === 'sleep' && nightFor(s))) {
    if (s.actKey === 'sleep') addLog(`${s.name} woke up`);
    endAct(s);
  }
  think(s);
}

function stepConvs(dtMin) {
  for (const c of convs.slice()) {
    const pair = [c.a, c.b], home = residents(c);
    if (c.mode === 'argue') {
      for (const s of pair) {
        s.needs.social = Math.min(100, s.needs.social + 0.8 * dtMin);
        s.needs.fun = Math.max(0, s.needs.fun - 1.1 * dtMin);
      }
      if (home) rel = Math.max(0, rel - 0.55 * dtMin);
      c.timer -= dtMin;
      if (c.timer <= 0) endConv(c, true);
      continue;
    }
    const bonus = home ? (0.8 + rel/120) * (family.partners ? 1.25 : 1) : 1.1;
    for (const s of pair) {
      s.needs.social = Math.min(100, s.needs.social + 3.0 * bonus * dtMin);
      // a little fun, not much: at 0.9 talking covered fun too, and nobody touched the games
      s.needs.fun = Math.min(100, s.needs.fun + 0.3 * dtMin);
    }
    if (home) rel = Math.min(100, rel + 0.30 * dtMin);
    c.timer -= dtMin;
    if (c.timer <= 0 || pair.every(s => s.needs.social > 96)) endConv(c, true);
  }
}

// who a Sim goes to talk to: their partner by preference, a visitor if there is one,
// otherwise whoever is nearest and free
function partnerFor(s) {
  let best = null, bestD = 1e9;
  const mine = convOf(s);
  for (const p of everyone()) {
    if (p === s || p.leaving || p.actKey === 'sleep') continue;
    const theirs = convOf(p);
    if (theirs && theirs !== mine) continue;
    let d = Math.abs(p.tx - s.tx) + Math.abs(p.ty - s.ty);
    if (family.partners && s.stage === 'adult' && p.stage === 'adult') d -= 5;
    if (s.stage !== p.stage) d -= 4;           // hosts seek out visitors, visitors their hosts
    if (d < bestD) { bestD = d; best = p; }
  }
  return best;
}

/* ---------- visitors ---------- */

const VISIT_GAP = 300;          // in-world minutes after one visit ends before the next knock
let doorOpenUntil = 0;          // animT, so the door swings for a moment of real time at any speed
const openDoor = () => { doorOpenUntil = animT + 1.4; };

function visitTick(dtMin) {
  for (const g of guests.slice()) {
    if (!g.leaving && (minutes >= g.leaveAt || hour() >= 22.5 || hour() < 6)) {
      const c = convOf(g);
      if (c) endConv(c, false);
      endAct(g);
      g.leaving = true;
      g.path = findPath(g.tx, g.ty, [DOOR]) || [DOOR.slice()];
      addLog(`${g.name} said goodbye`);
    }
    if (g.leaving && !g.path.length) {
      guests.splice(guests.indexOf(g), 1);
      lastVisit = minutes;
      openDoor();
    }
  }
  if (guests.length) return;

  const h = hour();
  if (h < 10 || h > 20 || minutes - lastVisit < VISIT_GAP) return;
  if (people.every(p => p.actKey === 'sleep')) return;
  // about one visit a day, more if someone's been messaging friends or is lonely
  let rate = 1 / 600;
  if (people.some(p => p.actKey === 'online' && !p.path.length)) rate *= 4;
  if (people.some(p => p.needs.social < 35)) rate *= 1.5;
  if (Math.random() > rate * dtMin) return;

  const who = friends.slice().sort(() => Math.random() - 0.5).slice(0, Math.random() < 0.3 ? 2 : 1);
  who.forEach((f, k) => guests.push(makeGuest(f, k)));
  lastVisit = minutes;
  openDoor();
  addLog(who.length === 2 ? `${who[0].name} and ${who[1].name} came over`
                          : `${who[0].name} ${who[0].from} dropped by`);
  for (const g of guests) think(g);
}

// one step of the whole world: the live loop, the catch-up replay and verify.js all use it
function tick(dtMin) {
  const before = minutes;
  minutes += dtMin;
  if (Math.floor(minutes/1440) > Math.floor(before/1440)) { day++; addLog('A new day'); }
  visitTick(dtMin);
  for (const s of everyone()) stepSim(s, dtMin);

/* ---------- rendering ----------
   Pixel art. The room is drawn one pixel at a time into a small fixed buffer — no
   canvas paths, so nothing is ever anti-aliased — and the canvas is then stretched
   to the window with nearest-neighbour scaling. Every edge is a hard pixel and every
   2:1 iso line is a clean two-pixel stair. */

// 32px tiles: the smallest size where a face still has room for two eyes and a mouth.
const TW = 32, TH = 16, WALL = 40;
const ROOM_W = 336, PH = 220;       // the whole room, plus headroom above the back wall
let PW = ROOM_W, OX = PW >> 1;       // PW grows past the room to fill the stage — see layout()
const OY = 52;

const cv = document.getElementById('c');
const ctx = cv.getContext('2d');

let glow = new Uint8Array(PW * PH);   // 1 = makes its own light, so the night pass leaves it alone
let EMIT = 0, EM = 0;                   // EMIT: whatever's being drawn glows; EM: set per-pixel by painters

// Every art pixel is always a whole number of device pixels: k is the biggest whole
// scale that fits the room across the stage, and the buffer then widens past the room
// (more backdrop either side) to fill the stage at that same k. Stretching to an exact
// width instead gave fractional scales, where some pixel rows came out fatter than others.
//
// On desktop and tablet k is also capped so the header, room and stats all fit on one
// screen. Phones scroll anyway, and a phone-height cap would shrink the room to nothing,
// so there the width alone decides.
function layout() {
  const dpr = window.devicePixelRatio || 1;
  const dev = Math.floor(cv.parentElement.clientWidth * dpr);
  let k = Math.max(1, Math.floor(dev / ROOM_W));
  const vw = window.innerWidth || 0, vh = window.innerHeight || 0;
  const wrap = document.getElementById('wrap');
  if (vw >= 700 && vh >= 500 && wrap && typeof wrap.getBoundingClientRect === 'function') {
    const rest = wrap.getBoundingClientRect().height - cv.getBoundingClientRect().height;
    // …but never below 2× for the cap's sake: on a very short window a little scrolling
    // beats a postage-stamp room
    k = Math.max(Math.min(k, 2), Math.min(k, Math.floor((vh - rest) * dpr / PH)));
  }
  const pw = Math.max(ROOM_W, Math.floor(dev / k));
  if (pw !== PW) {
    PW = pw; OX = PW >> 1;
    buf = new Uint32Array(PW * PH); glow = new Uint8Array(PW * PH); stamp = new Uint32Array(PW * PH);
    floorBuf = new Uint32Array(PW * PH);
    LR = new Float32Array(PW * PH); LG = new Float32Array(PW * PH); LB = new Float32Array(PW * PH);
    frameImg = null; floorKey = '';
    cv.width = PW;
  }
  // only a screen narrower than the room itself falls back to shrinking it
  const css = dev < ROOM_W ? cv.parentElement.clientWidth / PW : k / dpr;
  cv.style.width = PW * css + 'px';
  cv.style.height = PH * css + 'px';
}

function put(x, y, c) {

// even-odd scanline fill sampling pixel centres — the only rasteriser in the file
function scan(pts, cb) {
  let minY = Infinity, maxY = -Infinity;
  for (const p of pts) { if (p.y < minY) minY = p.y; if (p.y > maxY) maxY = p.y; }
  const y0 = Math.max(0, Math.ceil(minY - 0.5)), y1 = Math.min(PH - 1, Math.floor(maxY - 0.5));
  const n = pts.length, xs = [];

    for (let i = 0; i < n; i++) {

      if ((a.y <= sy) !== (b.y <= sy)) xs.push(a.x + (sy - a.y) * (b.x - a.x) / (b.y - a.y));
    }
    xs.sort((p, q) => p - q);

      const xa = Math.max(0, Math.ceil(xs[k] - 0.5)), xb = Math.min(PW - 1, Math.ceil(xs[k+1] - 0.5) - 1);

function fillPoly(pts, fill) {

      const c = fill(x, y, buf[i]);
      if (c) { buf[i] = c; glow[i] = EMIT | EM; }

function line(a, b, c) {
  let x0 = a.x, y0 = a.y; const x1 = b.x, y1 = b.y;

  let err = dx + dy;
  for (;;) {
    put(x0, y0, c);
    if (x0 === x1 && y0 === y1) break;
    const e2 = 2 * err;
    if (e2 >= dy) { err += dy; x0 += sx; }
    if (e2 <= dx) { err += dx; y0 += sy; }

// Outlines are found, not stroked: rasterise the silhouette into a scratch stamp and

let stamp = new Uint32Array(PW * PH);

function hull(ps) {

  const cross = (o, a, b) => (a.x - o.x) * (b.y - o.y) - (a.y - o.y) * (b.x - o.x);

  for (const q of p) { while (lo.length >= 2 && cross(lo[lo.length-2], lo[lo.length-1], q) <= 0) lo.pop(); lo.push(q); }

    const q = p[i];
    while (up.length >= 2 && cross(up[up.length-2], up[up.length-1], q) <= 0) up.pop();
    up.push(q);

// Any convex footprint extruded upward. Visible sides are shaded by which way they

function prism(plan, z0, z1, color, o = {}) {

   mirrored), every pose and every face, in whatever colours they happen to have. */

const SW = 18, SH = 30, SAX = 9;         // anchor column: feet (or lap) are centred on it
const D = { hw:10, hh:9, bw:8, bh:6, lh:4, e0:4, e1:7, ey:5 };   // head, body and leg sizes, eye columns

function buildPerson(c, gender, pose, fr, back, face) {
  const g = new Uint32Array(SW * SH);
  const set = (x, y, v) => { if (x >= 0 && y >= 0 && x < SW && y < SH) g[y * SW + x] = v; };
  const rect = (x, y, w, h, v) => { for (let j = 0; j < h; j++) for (let i = 0; i < w; i++) set(x + i, y + j, v); };
  const pants = c.pants || '#3f4a6b';
  // hair within a few shades of the skin turns the head into one blob at this size
  const lum = h => { const [r, g, b] = rgbOf(h); return r * .3 + g * .59 + b * .11; };
  // (always darken: lightening dark-brown hair turns it orange, and every skin tone is light enough to contrast with near-black)
  const hair = Math.abs(lum(c.hair) - lum(c.skin)) < 45 ? shade(c.hair, .5) : c.hair;
  const K = {
    sk:C(c.skin), skS:C(shade(c.skin, .84)), hr:C(hair), hrL:C(shade(hair, 1.45)),
    sh:C(c.shirt), shS:C(shade(c.shirt, .76)), pn:C(pants), pnS:C(shade(pants, .76)),
    shoe:C('#3b2d2a'), eye:C('#231a2c'), mouth:C('#8e3f45'), blush:C('#f09a98'), tear:C('#8fd0f0'),
    gtr:C('#c98a3e'), gtrD:C('#6a4028'),
  };
  const fem = gender === 'f', onlyHead = pose === 'head';
  const sit = pose === 'sit' || pose === 'sitback';
  const cx = 9, hx = cx - D.hw / 2, bx = cx - D.bw / 2;
  let headTop, bodyTop = 0, legTop = 0, ay;

  if (onlyHead) { headTop = 26 - D.hh; ay = 25; }
  else {
    const fy = sit ? 24 : 25;               // lap row when seated, sole row when standing
    ay = fy;
    legTop = sit ? 24 : fy - D.lh;
    const up = (pose === 'walk' || pose === 'dance') && (fr & 1) ? 1 : 0;   // bob up on the passing frames
    bodyTop = legTop - D.bh - up;
    headTop = bodyTop - D.hh;

    const lw = D.bw / 2 - 1, legs = [bx + 1, cx];
    if (!sit) {
      const lift = pose === 'walk' ? [fr === 1 ? 1 : 0, fr === 3 ? 1 : 0] : [0, 0];
      legs.forEach((x, k) => {
        const bot = fy - lift[k];
        if (fem) rect(x + (k ? 0 : 1), legTop, lw - 1, bot - legTop, k ? K.sk : K.skS);
        else rect(x, legTop, lw, bot - legTop, k ? K.pn : K.pnS);
        rect(x, bot, lw, 1, K.shoe);
      });
    } else {
      rect(bx, legTop, D.bw, 1, fem ? K.shS : K.pn);           // lap
      if (pose === 'sit') legs.forEach((x, k) => {             // shins over the edge of the seat
        if (fem) rect(x + (k ? 0 : 1), fy + 1, lw - 1, 2, k ? K.sk : K.skS);
        else rect(x, fy + 1, lw, 2, k ? K.pn : K.pnS);
        rect(x, fy + 3, lw, 1, K.shoe);
      });
    }

    rect(bx, bodyTop, D.bw, D.bh, K.sh);
    rect(bx, bodyTop, 1, D.bh, K.shS);                          // shadow side
    if (fem) {                                                  // skirt
      rect(bx, legTop - 2, D.bw, 2, K.shS);
      if (!sit) { set(bx - 1, legTop - 1, K.shS); set(bx + D.bw, legTop - 1, K.shS); }
    } else rect(bx, legTop - 1, D.bw, 1, K.pnS);               // waistband
    if (!back) { set(cx, bodyTop, K.sk); set(cx + 1, bodyTop, K.sk); }

    const armLen = D.bh - 1, L = bx - 1, R = bx + D.bw;
    const arm = (x, lift, len = armLen) => {
      for (let j = 0; j < len; j++) set(x, bodyTop - lift + j, j < 2 ? K.shS : K.sk);
    };
    if (pose === 'stretch') {
      const r = bodyTop + 1;
      if (fr & 1) for (let i = 0; i < 3; i++) { set(L - i, r, i ? K.sk : K.shS); set(R + i, r, i ? K.sk : K.shS); }
      else for (let y = headTop + 2; y <= bodyTop + 1; y++) {
        set(L, y, y >= bodyTop ? K.shS : K.sk); set(R, y, y >= bodyTop ? K.shS : K.sk);
      }
    } else if (pose === 'guitar') {
      arm(L, 0); arm(R, 0);
      const gy = bodyTop + 2;                                     // slung across the body
      rect(bx, gy + 1, 4, 3, K.gtr); rect(bx + 1, gy, 2, 1, K.gtr); rect(bx + 1, gy + 4, 2, 1, K.gtr);
      set(bx + 2, gy + 2, K.gtrD);
      for (let i = 0; i < 6; i++) set(bx + 4 + i, gy + 1 - (i >> 1), K.gtrD);
      set(bx + 2 + (fr & 1), gy + 3, K.sk);                        // strumming
      set(bx + 7, gy - 1, K.sk);
    } else if (pose === 'dance') {
      // one arm punched up at a time, swapping on each beat
      const upX = fr & 1 ? R : L;
      arm(fr & 1 ? L : R, 0);
      for (let y = headTop + 2; y <= bodyTop + 1; y++) set(upX, y, y >= bodyTop ? K.shS : K.sk);
    } else {
      let ll = armLen, rl = armLen, ra = 0;
      if (pose === 'walk') { if (fr === 1) { ll++; rl--; } else if (fr === 3) { rl++; ll--; } }
      if ((pose === 'use' || pose === 'talk') && (fr & 1)) ra = 2;
      arm(L, 0, ll); arm(R, ra, rl);
    }
  }

  // head
  rect(hx, headTop, D.hw, D.hh, K.sk);
  for (const [x, y] of [[hx, headTop], [hx + D.hw - 1, headTop], [hx, headTop + D.hh - 1], [hx + D.hw - 1, headTop + D.hh - 1]])
    set(x, y, 0);
  rect(hx + 1, headTop + D.hh - 1, D.hw - 2, 1, K.skS);
  if (back) {
    rect(hx + 1, headTop, D.hw - 2, 1, K.hr);
    rect(hx, headTop + 1, D.hw, D.hh - 2, K.hr);
    if (fem) rect(hx + 1, headTop + D.hh - 1, D.hw - 2, 4, K.hr);   // long hair down the back
    set(hx + D.hw - 1, headTop + D.ey, K.skS);                        // ear
    set(hx + 3, headTop + 1, K.hrL); set(hx + 4, headTop + 1, K.hrL);
  } else {
    if (!fem) set(hx + 1, headTop + D.ey, K.skS);                     // ear
    rect(hx + 1, headTop, D.hw - 2, 1, K.hr);
    rect(hx, headTop + 1, D.hw, 2, K.hr);
    rect(hx, headTop + 3, 2, 3, K.hr);                                // back of the head
    rect(hx + 2, headTop + 3, 3, 1, K.hr);                            // fringe
    set(hx + D.hw - 1, headTop + 3, K.hr);
    if (fem) {
      rect(hx, headTop + 3, 2, D.hh, K.hr);
      rect(hx + D.hw - 1, headTop + 3, 1, 4, K.hr);
      rect(hx + 2, headTop + 3, 4, 1, K.hr);
    }
    set(hx + 3, headTop + 1, K.hrL); set(hx + 4, headTop + 1, K.hrL); set(hx + 2, headTop + 2, K.hrL);
  }

  if (!back) {
    const e0 = hx + D.e0, e1 = hx + D.e1, ey = headTop + D.ey, my = ey + 2, mx = e0 + 1, E = K.eye;
    if (face === 'sleep' || face === 'blink') {
      set(e0 - 1, ey + 1, E); set(e0, ey + 1, E); set(e1, ey + 1, E); set(e1 + 1, ey + 1, E);
    } else if (face === 'tired') {
      set(e0, ey + 1, E); set(e1, ey + 1, E);
    } else if (face === 'angry') {
      set(e0, ey + 1, E); set(e1, ey + 1, E); set(e0 - 1, ey, E); set(e1 + 1, ey, E);
    } else {
      rect(e0, ey, 1, 2, E); rect(e1, ey, 1, 2, E);
    }
    if (face === 'happy' || face === 'talk') {
      set(mx, my, K.mouth); set(mx + 1, my, K.mouth);
      if (face === 'talk') { set(mx, my + 1, K.mouth); set(mx + 1, my + 1, K.mouth); }
      else { set(e0 - 1, my, K.blush); set(e1 + 1, my, K.blush); }
    } else if (face === 'angry') { set(mx, my, E); set(mx + 1, my, E); }
    else if (face === 'sleep') set(mx, my, K.skS);
    else set(mx, my, K.mouth);
    if (face === 'sad') set(e1, ey + 2, K.tear);
  }

  addOutline(g, SW, SH, C(OUTLINE));
  return { w: SW, h: SH, px: g, ay, top: headTop };
}

const spriteMemo = new Map();
function personSprite(s, pose, fr, back, face) {
  if (!['walk', 'use', 'talk', 'stretch', 'guitar', 'dance'].includes(pose)) fr = 0;
  const c = s.colors;
  const key = [c.skin, c.hair, c.shirt, c.pants, s.gender, pose, fr, back ? 1 : 0, back ? '' : face].join('|');
  let sp = spriteMemo.get(key);
  if (!sp) {
    if (spriteMemo.size > 800) spriteMemo.clear();
    sp = buildPerson(c, s.gender, pose, fr, back, face);
    spriteMemo.set(key, sp);
  }
  return sp;
}

// back = walking away from the camera; the two away-facings and two toward-facings
// are each one drawing and its mirror image
function facing(fx, fy) {
  if (Math.abs(fx) >= Math.abs(fy)) return fx < 0 ? { back:true, flip:true } : { back:false, flip:false };
  return fy < 0 ? { back:true, flip:false } : { back:false, flip:true };
}

function moodFace(s) {
  if ((animT + s.i * 1.3) % 3.7 < 0.14) return 'blink';
  const m = moodOf(s).label;
  return m === 'happy' || m === 'affectionate' ? 'happy' : m === 'tired' ? 'tired'
       : m === 'grumpy' || m === 'annoyed' ? 'angry' : m === 'lonely' ? 'sad' : 'content';

const inUse = (id, act) => everyone().some(p => p.held === id && !p.path.length && (!act || p.actKey === act));

/* ---------- the room ---------- */

const BG = '#1a2030';
let floorBuf = new Uint32Array(PW * PH);
let floorKey = '';

// X and Y are tile coordinates ×32, so grid lines land on whole pixels and come out
// as exact two-pixel stairs
function floorPx(px, py) {
  const a = px - OX, b = py - OY, X = a + 2 * b, Y = 2 * b - a;
  if (X < 0 || Y < 0 || X >= 320 || Y >= 320) return 0;
  const gx = X / 32, gy = Y / 32;

  if (gx >= 8.15 && gx < 8.85 && gy >= 1.1 && gy < 1.85)            // bath mat, by the tub
    return C((Y >> 1) & 1 ? '#8fc6d8' : '#a5d4e2');
  if (gx >= 6 && gy < 4) {                                           // bathroom: small square tiles
    if ((X & 15) < 2 || (Y & 15) < 2) return C('#9eb2ba');
    return C((((X >> 4) + (Y >> 4)) & 1) ? '#dce8ec' : '#cddde3');
  }
  if (gy < 4) {                                                      // bedroom carpet
    const h = hash(px, py);
    return C(h < 0.1 ? '#a8866c' : h > 0.93 ? '#c9a78b' : '#b8957a');
  }
  if (gx < 2 && gy >= 8) {                                           // entry: slate, doormat at the door
    if (gx >= 0.1 && gx < 0.75 && gy >= 8.12 && gy < 8.88)
      return C(gx < 0.18 || gx >= 0.67 || gy < 8.2 || gy >= 8.8 ? '#5a3f2c' : (X & 1) ? '#9a7248' : '#8a6440');
    if ((X & 31) < 2 || (Y & 31) < 2) return C('#4b525e');
    const t = hash(X >> 5, Y >> 5);
    return C(hash(px, py) > 0.9 ? '#7d8694' : t < 0.4 ? '#6b7482' : t < 0.7 ? '#737c8a' : '#646c79');
  }
  if (gx < 2 && gy < 8)                                              // kitchen lino
    return C((((X >> 4) + (Y >> 4)) & 1) ? '#e8dfc9' : '#b9ccc4');

  const X0 = 168, X1 = 280, Y0 = 204, Y1 = 284;                     // living-room rug
  if (Y >= Y0 + 2 && Y < Y1 - 2 && ((X >= X0 - 4 && X < X0) || (X >= X1 && X < X1 + 4)))
    if ((Y & 3) < 2) return C('#efe2c8');
  if (X >= X0 && X < X1 && Y >= Y0 && Y < Y1) {
    const d = Math.min(X - X0, X1 - 1 - X, Y - Y0, Y1 - 1 - Y);
    if (d < 3 || (d >= 6 && d < 9)) return C('#7d3434');
    if (d < 6) return C('#e0b457');
    const m = Math.abs(X - (X0 + X1) / 2) + Math.abs(Y - (Y0 + Y1) / 2);
    return C(m % 16 < 3 ? '#e0b457' : m % 16 < 5 ? '#9a4640' : '#b8574d');
  }

  const row = Y >> 3, off = (row * 19) % 48;                         // oak planks, staggered
  if ((Y & 7) < 2 || (X + off) % 48 < 2) return C('#7d5836');
  const t = hash(row, Math.floor((X + off) / 48));
  const base = t < 0.33 ? '#b98a58' : t < 0.66 ? '#ae8052' : '#c29562';
  return C(hash(px, py) > 0.94 ? shade(base, 0.9) : base);
}

function bakeFloor() {
  buf.fill(C(BG)); glow.fill(0);
  // the floor slab's edges, so the flat reads as a little diorama block
  fillPoly([P(10,0), P(10,10), P(10,10,-6), P(10,0,-6)], C('#5b4332'));
  fillPoly([P(0,10), P(10,10), P(10,10,-6), P(0,10,-6)], C('#47352a'));
  line(P(0,10,-6), P(10,10,-6), C(OUTLINE)); line(P(10,10,-6), P(10,0,-6), C(OUTLINE));
  fillPoly([P(0,0), P(10,0), P(10,10), P(0,10)], (x, y) => floorPx(x, y));
  line(P(0,10), P(10,10), C('#d6b58a')); line(P(10,10), P(10,0), C('#d6b58a'));

  const dim = k => (x, y, c) => scale(c, k);
  for (const o of OBJECTS) if (o.id !== 'mat')                         // contact shadows
    fillPoly([P(o.x+.08, o.y+.08), P(o.x+o.w+.1, o.y+.08), P(o.x+o.w+.1, o.y+o.h+.1), P(o.x+.08, o.y+o.h+.1)], dim(0.8));
  for (const tag of walls) {                                            // floor darkens where it meets a wall
    const [dir, xs, ys] = tag.split(':'), x = +xs, y = +ys, along = dir === 'N' ? y : x;
    if (wallHeight(along) <= 0) continue;
    const a = along === 0 ? 0 : -0.18, b = 0.18;
    fillPoly(dir === 'N' ? [P(x,y+a), P(x+1,y+a), P(x+1,y+b), P(x,y+b)]
                         : [P(x+a,y), P(x+b,y), P(x+b,y+1), P(x+a,y+1)], dim(0.87));
  }
  floorBuf.set(buf);
}

function wallHeight(coord) {   // px
  if (coord === 0 || wallMode === 'full') return WALL;
  return wallMode === 'off' ? 0 : 9;
}

const WALLPAPER = {
  bed(ux, v)     { if (v < 3) return v < 2 ? '#e9dfd0' : '#7a6a8e';
                   return (ux & 7) < 2 ? '#b4a5cd' : '#a797c3'; },
  bath(ux, v)    { if (v < 18) return ((ux & 3) === 0 || (v & 3) === 1) ? '#b3c8c7' : '#e3eeec';
                   return v < 20 ? '#7fa9a5' : '#a9d0cb'; },
  kitchen(ux, v) { if (v < 3) return v < 2 ? '#c2a574' : '#8c7248';

let skyTop = [0,0,0], skyBot = [0,0,0], clockHands = new Set();
const hexA = h => rgbOf(h);
const SKY = [
  [0,    hexA('#141a36'), hexA('#2a3160')],

function keyed(frames, h, k = 1) {
  for (let i = 0; i < frames.length - 1; i++) {
    const a = frames[i], b = frames[i + 1];
    if (h >= a[0] && h <= b[0]) {
      const t = (h - a[0]) / (b[0] - a[0]);
      return a[k].map((v, j) => v + (b[k][j] - v) * t);
    }
  }
  return frames[0][k];
}
const isNight = () => { const h = hour(); return h < 5.6 || h > 20.4; };

function windowPx(lu, lv, d) {
  const w = d.w, h = d.h;
  if (d.curtains) {
    const inL = lu >= -4 && lu < 2, inR = lu >= w - 2 && lu < w + 4;
    if ((inL || inR) && lv >= -4 && lv < h + 2) return (lu + 16) % 2 ? '#c4645a' : '#a3504a';
    if (lv >= h + 2 && lv < h + 4 && lu >= -5 && lu < w + 5) return lv === h + 2 ? '#4e3626' : '#6b4a36';
  }
  if (lu < 0 || lu >= w) return 0;
  if (lv < 0) return lv >= -2 ? (lv === -1 ? '#f4eee2' : '#a99d88') : 0;      // sill
  if (lv >= h) return 0;
  if (lu < 2 || lu >= w - 2 || lv < 2 || lv >= h - 2 || Math.abs(lu - (w - 1) / 2) < 1 || lv === Math.round(h * 0.62))
    return (lu === 0 || lu === w - 1 || lv === 0 || lv === h - 1) ? '#b3a792' : '#f1ebe0';
  EM = 1;
  return skyPx(lu, lv, w, h);
}
function skyPx(lu, lv, w, h) {
  const night = isNight();

  const bh = 3 + Math.floor(hash(Math.floor((lu + w * 3) / 4), 7) * 6);
  if (lv < bh) {
    if (night && (lu & 1) && lv % 3 === 1 && lv < bh - 1 && hash(lu * 5, lv) > 0.45) return C('#f2cf78');
    return night ? C('#1d2440') : blend(pack(...skyBot.map(v => v | 0)), C('#5f7896'), 0.55);
  }
  if (!night) {
    for (let k = 0; k < 2; k++) {
      const cx = ((minutes * 0.2 + k * 23 + w) % (w + 16)) - 8, cy = h * 0.66 + k * 3;
      const q1 = (lu - cx) ** 2 / 9 + (lv - cy) ** 2 / 2, q2 = (lu - cx - 3) ** 2 / 6 + (lv - cy - 1) ** 2 / 2;
      if (q1 < 1 || q2 < 1) return C(lv < cy ? '#dbe4ef' : '#f7f9fc');
    }
  } else {
    if ((lu - w * 0.7) ** 2 + (lv - h * 0.76) ** 2 < 5) return C('#efe9c8');
    if (hash(lu * 7, lv * 13) > 0.965) return C('#e8e6d0');
  }
  const t = Math.floor((lv / h) * 4 + bayer(lu, lv)) / 4;           // four dithered bands
  return pack(...skyBot.map((v, j) => (v + (skyTop[j] - v) * t) | 0));
}
function prepClock() {
  clockHands = new Set();
  const h = hour(), m = minutes % 60;
  const hand = (a, len) => {
    for (let t = 0; t <= len; t += 0.5)
      clockHands.add(Math.round(5 + Math.sin(a) * t) * 16 + Math.round(5 + Math.cos(a) * t));
  };
  hand((h % 12) / 12 * Math.PI * 2, 2.6);
  hand(m / 60 * Math.PI * 2, 3.8);
}
function clockPx(lu, lv) {
  const r2 = (lu - 5) ** 2 + (lv - 5) ** 2;
  if (r2 > 30) return 0;
  if (r2 > 19) return '#6b4a36';
  if (clockHands.has(lu * 16 + lv)) return '#2b2238';
  return (r2 > 13 && (lu === 5 || lv === 5)) ? '#9a8a78' : '#f6f1e4';
}
// the front door: two panels and a brass knob; swung open onto the landing while
// someone's coming or going
function doorPx(lu, lv, d) {
  const w = d.w, h = d.h;
  if (lu < 0 || lu >= w || lv >= h) return (lu === -2 || lu === w + 1 || lv === h + 1) ? '#b1a592' : '#efe8da';
  if (animT < doorOpenUntil) {
    if (lu < 3) return lu === 2 ? '#6b3f2a' : '#a3603c';                   // the door itself, edge-on
    if (lv < 4) return (lu + lv) & 1 ? '#8a8578' : '#9a9588';              // landing floor
    return lv > h - 5 ? '#3a3a48' : '#4a4a5a';
  }
  if (lu === 0 || lu === w - 1 || lv === h - 1) return '#6b3f2a';
  if (lu === w - 3 && (lv === 13 || lv === 14)) return '#f2c94c';
  const inPanel = lu >= 2 && lu <= w - 3 && ((lv >= 3 && lv <= 11) || (lv >= 16 && lv <= h - 4));
  if (!inPanel) return '#b8704a';
  const edge = lu === 2 || lv === 11 || lv === h - 4;
  return edge ? '#8e5236' : '#a3603c';
}

function wallPx(dir, f, px, py) {
  const [u, v] = dir === 'N' ? onS(f, px, py) : onE(f, px, py);
  const ux = Math.floor(u * 16), vy = Math.floor(v);
  if (f === 0) for (const d of DECOR) {
    if (d.dir !== dir) continue;
    let lu = ux - Math.round(d.u * 16);
    const lv = vy - d.v;
    if (lu < -d.pad || lu >= d.w + d.pad || lv < -d.pad || lv >= d.h + d.pad) continue;
    if (dir === 'W') lu = d.w - 1 - lu;      // the west wall runs right-to-left on screen
    let c;
    if (d.paint) c = d.paint(lu, lv, d);
    else {
      const a = DECOR_ART[d.art], ch = lu >= 0 && lv >= 0 && lu < d.w && lv < d.h ? a.rows[d.h - 1 - lv][lu] : '.';
      c = a.pal[ch] || 0;
    }
    if (c) return typeof c === 'string' ? C(c) : c;
  }
  return C(WALLPAPER[wallTheme(dir, f, u)](ux, vy));
}

// Walls have real thickness now: a papered face, a cap along the top and, where a
// run stops (a doorway or the room's corner), an end face.
function drawWall(dir, x, y) {
  const along = dir === 'N' ? y : x, h = wallHeight(along);
  if (h <= 0) return;
  const outer = along === 0, t = outer ? 0.16 : 0.12;
  const f = outer ? 0 : along + t / 2, bk = f - t;
  const cap = C(outer ? '#e8e0d0' : '#ddd3c2'), edge = C(OUTLINE), hi = C('#fbf6ec'), end = C('#b1a592');
  if (dir === 'N') {
    const x0 = outer && x === 0 ? -t : x;
    fillPoly([P(x,f,0), P(x+1,f,0), P(x+1,f,h), P(x,f,h)], (px, py) => wallPx('N', f, px, py));
    fillPoly([P(x0,bk,h), P(x+1,bk,h), P(x+1,f,h), P(x0,f,h)], cap);
    line(P(x0,bk,h), P(x+1,bk,h), edge);
    line(P(x,f,h), P(x+1,f,h), hi);
    if (!walls.has(`N:${x+1}:${y}`)) {
      fillPoly([P(x+1,f,0), P(x+1,bk,0), P(x+1,bk,h), P(x+1,f,h)], end);
      line(P(x+1,bk,0), P(x+1,bk,h), edge); line(P(x+1,bk,h), P(x+1,f,h), edge);
      line(P(x+1,f,0), P(x+1,f,h), edge);
    }
    if (!outer && !walls.has(`N:${x-1}:${y}`)) line(P(x,bk,h), P(x,f,h), edge);
  } else {
    const y0 = outer && y === 0 ? -t : y;
    fillPoly([P(f,y,0), P(f,y+1,0), P(f,y+1,h), P(f,y,h)], (px, py) => wallPx('W', f, px, py));
    fillPoly([P(bk,y0,h), P(f,y0,h), P(f,y+1,h), P(bk,y+1,h)], cap);
    line(P(bk,y0,h), P(bk,y+1,h), edge);
    line(P(f,y,h), P(f,y+1,h), hi);
    if (!walls.has(`W:${x}:${y+1}`)) {
      fillPoly([P(bk,y+1,0), P(f,y+1,0), P(f,y+1,h), P(bk,y+1,h)], end);
      line(P(bk,y+1,0), P(bk,y+1,h), edge); line(P(bk,y+1,h), P(f,y+1,h), edge);
      line(P(f,y+1,0), P(f,y+1,h), edge);
    }
    if (!outer && !walls.has(`W:${x}:${y-1}`)) line(P(bk,y,h), P(f,y,h), edge);
  }
}

function sunPatches() {
  const h = hour();
  let a = 0, tint;
  if (h > 6.5 && h < 18.5) { a = 0.55 * Math.sin(Math.PI * (h - 6.5) / 12); tint = c => scale(c, 1.2, 1.13, 0.96); }
  else if (isNight())       { a = 0.3; tint = c => scale(c, 0.95, 1.02, 1.25); }
  if (a <= 0.02) return;
  // dithered, so the light has a density instead of a flat wash
  const f = (x, y, c) => bayer(x, y) < a ? tint(c) : 0;
  fillPoly([P(8.1,0), P(9.4,0), P(9.8,2.3), P(8.5,2.3)], f);
  fillPoly([P(0,2.45), P(0,3.7), P(1.6,3.98), P(1.6,2.73)], f);
  fillPoly([P(0,6.3), P(0,7.7), P(2.3,8.1), P(2.3,6.7)], f);
}
