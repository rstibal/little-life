<title>Little Life</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Pixelify+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root {
    --night:#131722; --panel:#1f2636; --panel-2:#2b3448; --line:#3b4763; --drop:#0a0d14;
    --ink:#f0eadc; --ink-dim:#a3adc2; --ink-faint:#737e96; --stage:#1a2030;
    --lamp:#f2c063; --lamp-edge:#b8862e; --good:#7cc4a4; --mid:#e3b45c; --low:#db6f61;
  }
  * { box-sizing:border-box; }
  body {
    margin:0; background:var(--night); color:var(--ink);
    font-family:"Pixelify Sans", ui-monospace, monospace;
  }
  .wrap { padding:12px 16px 34px; }

  /* chunky pixel panels: a 3px border with the corners notched out, and a hard drop */
  .px {
    background:var(--panel);
    box-shadow: 0 -3px 0 var(--line), 0 3px 0 var(--line), -3px 0 0 var(--line), 3px 0 0 var(--line),
                0 7px 0 var(--drop);
    margin:3px;
  }

  .topbar { display:flex; align-items:baseline; justify-content:space-between; margin:0 3px 10px; }
  .title { font-size:28px; font-weight:700; letter-spacing:.02em; color:var(--lamp);
           text-shadow:3px 3px 0 var(--drop); }
  .clock { text-align:right; line-height:1.15; }
  .time { font-size:22px; font-weight:600; font-variant-numeric:tabular-nums; }
  .day { font-size:14px; color:var(--ink-dim); }

  .stage { background:var(--stage); overflow:hidden; margin-bottom:14px; display:flex; justify-content:center; }
  canvas#c { display:block; image-rendering:pixelated; image-rendering:crisp-edges; }
  canvas#c { image-rendering:pixelated; }

  .toolbar { display:flex; flex-wrap:wrap; gap:6px 18px; margin:0 0 20px; }
  .controls { display:flex; gap:6px; flex:1 1 320px; }
  .controls button {
    flex:1; padding:7px 0 8px; background:var(--panel); color:var(--ink-dim); border:0;
    font-family:inherit; font-size:15px; cursor:pointer;
    box-shadow: 0 -3px 0 var(--line), 0 3px 0 var(--line), -3px 0 0 var(--line), 3px 0 0 var(--line),
                0 6px 0 var(--drop);
    margin:3px 3px 6px;
  }
  .controls button:hover { color:var(--ink); }
  .controls button:active { transform:translateY(3px); box-shadow: 0 -3px 0 var(--line), 0 3px 0 var(--line),
                            -3px 0 0 var(--line), 3px 0 0 var(--line); }
  .controls button:focus-visible { outline:3px solid var(--lamp); outline-offset:3px; }
  .controls button[aria-pressed="true"] {
    background:var(--lamp); color:#2a2010;
    box-shadow: 0 -3px 0 var(--lamp-edge), 0 3px 0 var(--lamp-edge), -3px 0 0 var(--lamp-edge),
                3px 0 0 var(--lamp-edge), 0 6px 0 var(--drop);
  }

  .below { display:grid; grid-template-columns:minmax(0,2fr) minmax(260px,1fr); gap:20px 24px; align-items:start; }
  @media (max-width:760px) { .below { grid-template-columns:1fr; } .logbox { height:280px; } }
  #cards { display:grid; grid-template-columns:repeat(auto-fill, minmax(270px, 1fr)); gap:14px 18px; }

  h2 { font-size:15px; font-weight:500; color:var(--ink-dim); margin:0 0 8px; }

  .card { padding:10px 12px 12px; }
  .card-head { display:flex; align-items:center; gap:10px; margin-bottom:6px; }
  .face { width:48px; height:48px; flex:none; image-rendering:pixelated; background:var(--panel-2); }
  .who { display:flex; flex-direction:column; min-width:0; }
  .nm { font-size:20px; font-weight:600; background:none; border:none; border-bottom:2px dashed transparent;
        color:var(--ink); font-family:inherit; padding:0; width:8ch; }
  .nm:hover, .nm:focus { border-bottom-color:var(--line); outline:none; }
  .moodword { font-size:14px; color:var(--ink-dim); }
  .traits { margin-left:auto; align-self:flex-start; font-size:13px; color:var(--ink-faint); text-align:right; }
  .act { font-size:15px; color:var(--lamp); margin:2px 0 10px; min-height:1.2em; }
  .needs { display:grid; grid-template-columns:1fr 1fr; gap:7px 16px; }
  .need-row { display:flex; align-items:center; gap:8px; font-size:13.5px; }
  .need-row .lbl { width:54px; color:var(--ink-dim); flex:none; }
  /* bars are segmented, like an old game's health meter */
  .bar { flex:1; height:8px; background:var(--panel-2); position:relative; overflow:hidden; }
  .bar i { display:block; height:100%; transition:width .3s linear, background .5s; }
  .bar::after { content:""; position:absolute; inset:0;
                background:repeating-linear-gradient(90deg, transparent 0 6px, var(--panel) 6px 8px); }

  .rel { display:flex; align-items:center; gap:10px; font-size:15px; padding:10px 12px; margin-top:14px; }
  .rel .lbl { color:var(--ink-dim); flex:none; }
  .rel .val { color:var(--ink); font-variant-numeric:tabular-nums; flex:none; width:10ch; text-align:right; }

  /* The log never sets the row's height: contain:size gives it no height of its own, so it
     stretches to end level with the Together meter and scrolls inside that. */
  .logbox { padding:10px 12px; align-self:stretch; contain:size; display:flex; flex-direction:column; }
  .log { list-style:none; margin:0; padding:0; font-size:14px; flex:1; min-height:0; overflow-y:auto;
         scrollbar-width:thin; scrollbar-color:var(--line) transparent; }
  .log li { display:flex; gap:10px; padding:5px 0; border-bottom:2px solid var(--panel-2); color:var(--ink-dim); }
  .log li:last-child { border-bottom:0; }
  .log li:first-child { color:var(--ink); }
  .log .t { font-variant-numeric:tabular-nums; color:var(--ink-faint); flex:none; width:6.4ch; }

<script>
const COLS = 10, ROWS = 10;

const NEEDS = [
  { k:'energy',  label:'Energy',  decay:5.2, weight:1.15 },
  { k:'hunger',  label:'Hunger',  decay:6.4, weight:1.20 },
  { k:'bladder', label:'Bladder', decay:7.8, weight:1.40 },
  { k:'hygiene', label:'Clean',   decay:4.0, weight:0.85 },
  { k:'fun',     label:'Fun',     decay:5.6, weight:0.80 },
  { k:'social',  label:'Social',  decay:3.6, weight:0.70 },
];
const NEED = k => NEEDS.find(n => n.k === k);

/* Traits shift decay rates, need weights, and a few behaviour knobs.
   Two per Sim, drawn at start, never opposites. */
const TRAITS = {
  neat:      { name:'neat',       weight:{hygiene:1.7}, decay:{hygiene:1.2} },
  slob:      { name:'slob',       weight:{hygiene:0.45} },
  glutton:   { name:'glutton',    decay:{hunger:1.4} },
  nightOwl:  { name:'night owl',  shift: 2.5 },
  earlyBird: { name:'early bird', shift:-2.0 },
  sociable:  { name:'sociable',   weight:{social:1.7}, decay:{social:1.3}, chat:1.5 },
  loner:     { name:'loner',      weight:{social:0.5}, chat:0.35 },
  lazy:      { name:'lazy',       decay:{energy:1.3}, idle:2.2 },
  playful:   { name:'playful',    weight:{fun:1.5}, decay:{fun:1.2} },
  bookish:   { name:'bookish',    weight:{fun:0.75}, chat:0.75 },
};

const OBJECTS = [
  // bedroom — beds run away from the head wall, nightstand between them
  { id:'bed0',   x:1, y:0, w:1, h:2, hgt:0.20, color:'#9891e0', sit:true, cap:1 },
  { id:'bed1',   x:3, y:0, w:1, h:2, hgt:0.20, color:'#7fc0e0', sit:true, cap:1 },
  { id:'stand',  x:2, y:0, w:1, h:1, hgt:0.42, color:'#7a5a3e', cap:9 },
  { id:'desk',   x:0, y:3, w:1, h:1, hgt:0.46, color:'#8a6a4a', cap:1 },
  { id:'kidbed0',x:0, y:0, w:1, h:2, hgt:0.20, color:'#d78b52', sit:true, cap:1 },
  { id:'kidbed1',x:3, y:3, w:1, h:1, hgt:0.34, color:'#88a0c8', sit:true, cap:1 },
  { id:'crib',   x:4, y:0, w:1, h:1, hgt:0.50, color:'#c8b08a', cap:1 },

  // bathroom — all plumbing along one wall
  { id:'shower', x:5, y:0, w:1, h:1, hgt:1.00, color:'#a6e4ea', cap:1 },
  { id:'sink',   x:6, y:0, w:1, h:1, hgt:0.55, color:'#cdeadf', cap:1 },
  { id:'toilet', x:7, y:0, w:1, h:1, hgt:0.40, color:'#fdf3e2', sit:true, cap:1 },

  // kitchen — a run of units down the west wall, table alongside
  { id:'fridge', x:0, y:4, w:1, h:1, hgt:1.25, color:'#d7d7cb', cap:1 },
  { id:'stove',  x:0, y:5, w:1, h:1, hgt:0.55, color:'#8b8b84', cap:1 },
  { id:'counter',x:0, y:6, w:1, h:1, hgt:0.52, color:'#b9b3a4', cap:9 },
  { id:'table',  x:2, y:5, w:2, h:1, hgt:0.46, color:'#a8763e', cap:2 },

  // hobbies along the divider wall
  { id:'guitar', x:4, y:4, w:1, h:1, hgt:0.78, color:'#c98a3e', cap:1 },
  { id:'easel',  x:5, y:4, w:1, h:1, hgt:0.95, color:'#cbb089', cap:1 },
  { id:'shelf',  x:9, y:4, w:1, h:1, hgt:1.30, color:'#8a5a3c', cap:1 },
  { id:'arcade', x:0, y:8, w:1, h:1, hgt:1.10, color:'#4a6fa5', cap:1 },
  { id:'mat',    x:3, y:8, w:1, h:1, hgt:0.04, color:'#7fb5a8', cap:1 },

  // living — the sofa faces south across the rug to the TV, so sitters face the camera
  { id:'sofa',   x:6, y:6, w:2, h:1, hgt:0.16, color:'#ff9c74', sit:true, cap:2 },
  { id:'tv',     x:6, y:8, w:1, h:1, hgt:0.45, color:'#5c6486', cap:9 },
  { id:'lamp',   x:9, y:6, w:1, h:1, hgt:1.05, color:'#e0b457', cap:9 },
  { id:'plant',  x:9, y:9, w:1, h:1, hgt:0.72, color:'#4e8f5a', cap:9 },
];
const byId = id => OBJECTS.find(o => o.id === id);

const ACTS = {
  sleep:  { obj:s=>s.bedId,   need:'energy',  rate:0.30, cap:99, verb:'Sleeping',           icon:'💤', log:'went to bed' },
  tend:   { obj:()=>'crib',   verb:'Looking after the baby', icon:'🍼', log:'went to check on the baby',
            adultOnly:true, tend:true },
  eat:    { obj:()=>'table',  need:'hunger',  rate:3.40, cap:98, verb:'Eating',             icon:'🍽️', log:'sat down to eat' },
  cook:   { obj:()=>'stove',  fixed:22,                          verb:'Cooking',            icon:'🍳', log:'started cooking', then:'eat', adultOnly:true },
  snack:  { obj:()=>'fridge', need:'hunger',  rate:4.50, cap:52, verb:'Raiding the fridge', icon:'🥪', log:'grabbed a snack' },
  toilet: { obj:()=>'toilet', need:'bladder', rate:11.0, cap:99, verb:'In the bathroom',    icon:'🚽', log:'went to the bathroom' },
  shower: { obj:()=>'shower', need:'hygiene', rate:5.00, cap:98, verb:'Taking a shower',    icon:'🚿', log:'got in the shower' },
  wash:   { obj:()=>'sink',   need:'hygiene', rate:7.00, cap:55, verb:'Washing up',         icon:'🧼', log:'washed up' },
  tv:     { obj:()=>'sofa',   need:'fun',     rate:2.60, cap:88, verb:'Watching TV',        icon:'📺', log:'put the TV on', variety:true, likes:'lazy' },
  read:   { obj:()=>'shelf',  need:'fun',     rate:2.20, cap:88, verb:'Reading',            icon:'📖', log:'picked out a book', variety:true, likes:'bookish' },
  paint:  { obj:()=>'easel',  need:'fun',     rate:2.40, cap:90, verb:'Painting',           icon:'🎨', log:'started painting', variety:true },
  guitar: { obj:()=>'guitar', need:'fun',     rate:3.00, cap:90, verb:'Playing guitar',     icon:'🎸', log:'picked up the guitar', variety:true, likes:'playful' },
  arcade: { obj:()=>'arcade', need:'fun',     rate:3.60, cap:94, verb:'Playing the arcade', icon:'🕹️', log:'fired up the arcade cabinet', variety:true, likes:'playful' },
  stretch:{ obj:()=>'mat',    need:'fun',     rate:1.90, cap:76, verb:'Stretching',         icon:'🧘', log:'unrolled the mat', variety:true,
            costs:{ hygiene:0.55 }, gains:{ energy:0.35 } },
  online: { obj:()=>'desk',   need:'social',  rate:2.20, cap:80, verb:'Messaging friends',  icon:'💬', log:'sat down at the desk', variety:true, adultOnly:true },
  relax:  { obj:()=>'sofa',   need:'fun',     rate:0.70, cap:58, verb:'Sitting around',     icon:'🌿', log:'flopped on the sofa', idle:true, variety:true },
  chat:   { social:true,                                         verb:'Chatting',           icon:'💭' },
};

/* Walls. 'N:x:y' sits on the north edge of tile (x,y), 'W:x:y' on its west edge.
   Depth here is gx+gy, so a wall only hides things when its own coordinate is
   above zero — which is exactly the set cutaway mode knocks down. */
const walls = new Set();
for (let x = 0; x < COLS; x++) walls.add(`N:${x}:0`);
for (let y = 0; y < ROWS; y++) walls.add(`W:0:${y}`);
for (let x = 0; x < COLS; x++) if (x !== 2 && x !== 7) walls.add(`N:${x}:4`);
for (let y = 0; y < 4; y++) if (y !== 2) walls.add(`W:5:${y}`);

let wallMode = 'cutaway';

const blocked = Array.from({ length: COLS }, () => Array(ROWS).fill(false));
for (const o of OBJECTS)
  for (let i = 0; i < o.w; i++)
    for (let j = 0; j < o.h; j++) blocked[o.x + i][o.y + j] = true;

const inBounds = (x,y) => x>=0 && y>=0 && x<COLS && y<ROWS;
const free = (x,y) => inBounds(x,y) && !blocked[x][y];

function canCross(fx, fy, tx, ty) {
  if (ty === fy + 1) return !walls.has(`N:${tx}:${ty}`);
  if (ty === fy - 1) return !walls.has(`N:${fx}:${fy}`);
  if (tx === fx + 1) return !walls.has(`W:${tx}:${ty}`);
  if (tx === fx - 1) return !walls.has(`W:${fx}:${fy}`);
  return true;
}

function approachTiles(o) {
  const out = [], seen = new Set();
  for (let i = 0; i < o.w; i++)
    for (let j = 0; j < o.h; j++) {
      const ox = o.x + i, oy = o.y + j;
      for (const [dx, dy] of [[1,0],[-1,0],[0,1],[0,-1]]) {
        const x = ox + dx, y = oy + dy, k = x + ',' + y;
        // must be walkable AND not on the far side of a wall from the object
        if (!free(x, y) || seen.has(k) || !canCross(x, y, ox, oy)) continue;
        seen.add(k); out.push([x, y]);
      }
    }
  return out;
}

function neighbourTiles(tx, ty) {
  const out = [];
  for (const [dx,dy] of [[0,0],[1,0],[-1,0],[0,1],[0,-1]]) {
    const x = Math.round(tx)+dx, y = Math.round(ty)+dy;
    if (free(x,y)) out.push([x,y]);
  }
  return out;
}

function findPath(sx, sy, goals) {
  sx = Math.round(sx); sy = Math.round(sy);
  const key = (x,y) => x*ROWS + y;
  const goalSet = new Set(goals.map(g => key(g[0], g[1])));
  if (!goalSet.size) return null;
  if (goalSet.has(key(sx,sy))) return [];
  const prev = new Map([[key(sx,sy), null]]);
  const q = [[sx,sy]];
  while (q.length) {
    const [x,y] = q.shift();
    for (const [dx,dy] of [[1,0],[-1,0],[0,1],[0,-1]]) {
      const nx = x+dx, ny = y+dy, k = key(nx,ny);
      if (!free(nx,ny) || prev.has(k) || !canCross(x,y,nx,ny)) continue;
      prev.set(k, [x,y]);
      if (goalSet.has(k)) {
        const path = []; let cur = [nx,ny];
        while (cur) { path.push(cur); cur = prev.get(key(cur[0],cur[1])); }
        return path.reverse().slice(1);
      }
      q.push([nx,ny]);
    }
  }
  return null;
}

/* ---------- sims ---------- */

const MALE_NAMES = ['Arlo','Bo','Cass','Dex','Emmet','Finn','Gus','Hugo','Ira','Jonah',
                    'Kit','Levi','Milo','Nash','Otis','Rafe','Silas','Theo','Vance','Wyatt'];
const FEMALE_NAMES = ['Ada','Bea','Cleo','Dot','Elsie','Fern','Greta','Hazel','Iris','Juno',
                      'Kira','Lark','Maeve','Nell','Opal','Pearl','Romy','Sage','Thea','Wren'];
const pick = a => a[Math.floor(Math.random()*a.length)];
const randomName = g => pick(g === 'm' ? MALE_NAMES : FEMALE_NAMES);
const BABY_NEEDS = ['hunger','energy','hygiene','social'];

function makeSim(i, name, gender, traitKeys, colors, opts = {}) {
  const needs = {};
  for (const n of NEEDS) needs[n.k] = 45 + Math.random()*30;
  traitKeys = (traitKeys || []).filter(k => TRAITS[k]);
  if (!traitKeys.length) traitKeys = drawTraits();
  const traits = traitKeys.map(k => TRAITS[k]);
  const decayMul = {}, weightMul = {};
  for (const n of NEEDS) { decayMul[n.k] = 1; weightMul[n.k] = 1; }
  let shift = 0, chatMul = 1, idleMul = 1;
  for (const t of traits) {
    for (const k in (t.decay || {})) decayMul[k] *= t.decay[k];
    for (const k in (t.weight || {})) weightMul[k] *= t.weight[k];
    shift += t.shift || 0;
    chatMul *= t.chat || 1;
    idleMul *= t.idle || 1;
  }
  const stage = opts.stage || 'adult';
  return { i, name, gender, needs, traits, traitKeys, decayMul, weightMul, shift, chatMul, idleMul,
           colors, tx: opts.tx ?? (3 + i*2), ty: opts.ty ?? 6, path: [], act: null, actKey: null,
           timer: 0, bob: 0, held: null, emotion: null,
           recent: {}, dirx: 1, diry: 0, chatTarget: null,
           stage, mobile: stage !== 'baby', ageDays: opts.ageDays || 0,
           bedId: opts.bedId || ('bed' + i),
           scale: stage === 'child' ? 0.74 : 1,
           showNeeds: stage === 'baby' ? BABY_NEEDS : NEEDS.map(n => n.k) };
}

const OPPOSITE = { neat:'slob', slob:'neat', sociable:'loner', loner:'sociable',
                   nightOwl:'earlyBird', earlyBird:'nightOwl' };
const pool = Object.keys(TRAITS);
function drawTraits() {
  const a = pool[Math.floor(Math.random()*pool.length)];
  let b = a;
  while (b === a || OPPOSITE[a] === b) b = pool[Math.floor(Math.random()*pool.length)];
  return [a, b];
}

const SHIRTS = ['#e0a35c','#7fb5a8','#c4645a','#6c8bd0','#c9a3d6','#8fbf6a'];
const PANTS  = ['#3f4a6b','#4d3f36','#2f3a4a','#4b5d4a','#5a4a6a','#6a5040'];
const SKINS  = ['#e8b892','#c98f68','#a9714c','#f0c8a8','#8d5a3b'];
const HAIRS  = ['#4a3a30','#241c18','#6b4423','#8d6a4a','#2b2b33','#a3743c'];
function paletteFor(gender, i) {
  return {
    shirt: SHIRTS[(i + (gender === 'f' ? 1 : 0)) % SHIRTS.length],
    skin:  pick(SKINS),
    hair:  pick(HAIRS),
    pants: PANTS[(i * 2 + (gender === 'f' ? 1 : 0)) % PANTS.length],
  };
}

const SAVE_KEY = 'little-life-save';
const AWAY_MIN_PER_SEC = 0.4;      // roughly one real hour per in-world day
const MAX_AWAY = 1440 * 7;         // never fast-forward more than a week
let quiet = false;                 // suppresses the log during catch-up

function loadSave() {
  try {
    const raw = localStorage.getItem(SAVE_KEY);
    if (!raw) return null;
    const d = JSON.parse(raw);
    return d && d.v === 4 && Array.isArray(d.people) && d.people.length >= 2 ? d : null;
  } catch (e) { return null; }
}

const saved = loadSave();

function restorePerson(d, i) {
  const g = d.gender || (i ? 'f' : 'm');
  const s = makeSim(i, d.name || randomName(g), g, d.traits,
                    Object.assign(paletteFor(g, i), d.colors || {}),
                    { stage:d.stage, bedId:d.bedId, ageDays:d.ageDays, tx:d.tx, ty:d.ty });
  for (const n of NEEDS)
    if (typeof d.needs?.[n.k] === 'number') s.needs[n.k] = d.needs[n.k];
  s.emotion = d.emotion || null;
  return s;
}

function newHousehold() {
  return [
    makeSim(0, randomName('m'), 'm', drawTraits(), paletteFor('m', 0), { bedId:'bed0' }),
    makeSim(1, randomName('f'), 'f', drawTraits(), paletteFor('f', 1), { bedId:'bed1' }),
  ];
}

const people = saved ? saved.people.map(restorePerson) : newHousehold();

let rel = saved ? saved.rel : 12;
const family = saved ? { partners: !!(saved.family && saved.family.partners),
                         born: (saved.family && saved.family.born) || 0 }
                     : { partners: false, born: 0 };
const chat = { on:false, timer:0, mode:'chat', a:null, b:null };

const adults = () => people.filter(p => p.stage === 'adult');
const babyIn = () => people.find(p => p.stage === 'baby') || null;

let minutes = saved ? saved.minutes : 7*60;
let day = saved ? saved.day : 1;
let speed = 1;

/* ---------- mood ----------
   Needs decide what's possible; mood nudges how appealing each option feels,
   and two of these moods make a conversation likely to go badly. */
const MOODS = {
  happy:        { label:'happy',        emoji:'😄', sleep:0,  chat:  6, argue:-0.12 },
  content:      { label:'content',      emoji:'🙂', sleep:0,  chat:  0, argue: 0.00 },
  tired:        { label:'tired',        emoji:'🥱', sleep:18, chat: -8, argue: 0.10 },
  grumpy:       { label:'grumpy',       emoji:'😠', sleep:0,  chat: -6, argue: 0.26 },
  lonely:       { label:'lonely',       emoji:'😔', sleep:0,  chat: 16, argue: 0.04 },
  annoyed:      { label:'annoyed',      emoji:'😤', sleep:0,  chat:-14, argue: 0.30 },
  affectionate: { label:'affectionate', emoji:'🥰', sleep:0,  chat: 14, argue:-0.25 },
};

function moodOf(s) {
  if (s.emotion && minutes < s.emotion.until && MOODS[s.emotion.key])
    return MOODS[s.emotion.key];
  const phys = (s.needs.energy + s.needs.hunger + s.needs.bladder + s.needs.hygiene) / 4;
  const soc  = (s.needs.fun + s.needs.social) / 2;
  if (s.needs.energy < 28) return MOODS.tired;
  if (phys < 38) return MOODS.grumpy;
  if (s.needs.social < 25) return MOODS.lonely;
  if (phys > 72 && soc > 68) return MOODS.happy;
  return MOODS.content;
}

function setEmotion(s, key, mins) { s.emotion = { key, until: minutes + mins }; }
const MIN_PER_SEC = 4;
const logs = [];

/* ---------- brain ---------- */

const hour = () => (minutes/60) % 24;
function nightFor(s) {
  const h = hour(), start = 22.5 + s.shift, end = 6.5 + s.shift;
  return start < 24 ? (h >= start || h < end) : (h >= start - 24 && h < end);
}

function taken(objId, self) {
  const o = byId(objId);
  return people.filter(s => s !== self && s.held === objId).length >= o.cap;
}

function urgency(key, s) {
  const a = ACTS[key];
  const m = moodOf(s);
  if (a.social) {
    const other = partnerFor(s);
    if (!other) return 0;
    const pair = s.stage === 'adult' && other.stage === 'adult';
    let u = Math.pow(1 - s.needs.social/100, 2) * 100 * NEED('social').weight * s.weightMul.social;
    return Math.max(0, u * s.chatMul * (pair ? 0.6 + rel/140 : 0.9) + m.chat);
  }
  if (a.tend) {
    const b = babyIn();
    if (!b || s.stage !== 'adult') return 0;
    const worst = Math.min(...BABY_NEEDS.map(k => b.needs[k]));
    return Math.pow(1 - worst/100, 2) * 100 * 1.9;
  }
  if (a.idle) {
    let u = 5 * s.idleMul;
    if (minutes - (s.recent[key] ?? -1e9) < 200) u -= 7;
    return u;
  }
  if (key === 'cook' || key === 'eat') {
    // without this, someone full at the table re-picks eating every tick, since it ends the moment it starts
    if (s.needs.hunger >= ACTS.eat.cap - 1) return 0;
    return Math.pow(1 - s.needs.hunger/100, 2) * 100 * 1.20 * s.weightMul.hunger * 1.05;
  }

  const v = s.needs[a.need];
  if (v >= a.cap - 1) return 0;
  let u = Math.pow(1 - v/100, 2) * 100 * NEED(a.need).weight * s.weightMul[a.need];
  if (key === 'sleep') u += (nightFor(s) ? 30 : -14) + m.sleep;
  if (key === 'snack') u *= 0.72;
  if (key === 'wash') u *= 0.6;
  if (a.likes && s.traitKeys.includes(a.likes)) u += 15;
  // doing the same thing again soon after is less appealing than trying something else
  if (a.variety && minutes - (s.recent[key] ?? -1e9) < 260) u -= 26;
  return u;
}

function distanceTo(key, s) {
  if (ACTS[key].social) {
    const o = s.chatTarget || partnerFor(s);
    if (!o) return 99;
    return Math.abs(o.tx - s.tx) + Math.abs(o.ty - s.ty);
  }
  const o = byId(ACTS[key].obj(s));
  return Math.abs(o.x - s.tx) + Math.abs(o.y - s.ty);
}

function targetTiles(key, s) {
  if (ACTS[key].social) {
    const o = s.chatTarget || partnerFor(s);
    return o ? neighbourTiles(o.tx, o.ty) : [];
  }
  return approachTiles(byId(ACTS[key].obj(s)));
}

function bestAction(s) {
  let best = 'relax', bestScore = -Infinity;
  for (const key of Object.keys(ACTS)) {
    const a = ACTS[key];
    if (a.adultOnly && s.stage !== 'adult') continue;
    if (!a.social && taken(a.obj(s), s)) continue;
    const score = urgency(key, s) - distanceTo(key, s) * 1.0;
    if (score > bestScore) { bestScore = score; best = key; }
  }
  return { key: best, score: bestScore };
}

function endAct(s) { s.act = null; s.actKey = null; s.held = null; s.path = []; }

function startAct(key, s, quiet) {
  const a = ACTS[key];
  s.actKey = key; s.act = a;
  s.recent[key] = minutes;
  s.timer = a.fixed || 0;
  if (a.social) s.chatTarget = partnerFor(s);
  s.held = a.social ? null : a.obj(s);
  s.path = findPath(s.tx, s.ty, targetTiles(key, s)) || [];
  if (!quiet && a.log) addLog(`${s.name} ${a.log}`);
}

function endChat(natural) {
  const wasArgument = chat.mode === 'argue';
  const pair = [chat.a, chat.b].filter(Boolean);
  const couple = pair.length === 2 && pair.every(p => p.stage === 'adult');
  chat.on = false;
  for (const s of people) if (s.actKey === 'chat') endAct(s);
  chat.mode = 'chat'; chat.a = chat.b = null;
  if (!natural) return;
  if (wasArgument) {
    for (const s of pair) setEmotion(s, 'annoyed', 110);
    addLog('The argument fizzled out');
    return;
  }
  if (rel > 52) for (const s of pair) setEmotion(s, 'affectionate', 150);
  if (couple && !family.partners && rel >= 84) {
    family.partners = true;
    addLog(`${pair[0].name} and ${pair[1].name} are a couple now`);
  } else {
    addLog('They wrapped up their conversation');
  }
}

function think(s) {
  const { key, score } = bestAction(s);
  if (!s.actKey) { startAct(key, s); return; }
  if (key === s.actKey) return;
  const cur = urgency(s.actKey, s) - distanceTo(s.actKey, s) * 1.0;
  const margin = s.actKey === 'sleep' ? 62 : chat.on ? 42 : 26;
  if (score - cur > margin) {
    if (chat.on && s.actKey === 'chat') endChat(false);
    startAct(key, s);
  }
}

function tryChat(s) {
  const other = s.chatTarget;
  if (!other) { endAct(s); return; }
  const busy = other.actKey && other.actKey !== 'chat' && urgency(other.actKey, other) > 45;
  if (other.actKey === 'sleep' || busy) {
    addLog(`${s.name} couldn't get ${other.name}'s attention`);
    endAct(s);
    s.needs.social = Math.max(0, s.needs.social - 3);
    setEmotion(s, 'annoyed', 40);
    return;
  }
  if (other.actKey !== 'chat') { endAct(other); other.actKey = 'chat'; other.act = ACTS.chat; }

  // whether this goes well depends on how both of them feel and where they stand
  const relPull = rel < 30 ? 0.12 : rel > 70 ? -0.15 : 0;
  let p = Math.min(0.7, Math.max(0, 0.06 + moodOf(s).argue + moodOf(other).argue + relPull));
  if (family.partners) p *= 0.5;
  if (s.stage !== 'adult' || other.stage !== 'adult') p *= 0.4;
  chat.mode = Math.random() < p ? 'argue' : 'chat';
  chat.a = s; chat.b = other;
  chat.on = true;
  chat.timer = chat.mode === 'argue' ? 14 : 34;
  addLog(chat.mode === 'argue'
    ? `${s.name} and ${other.name} started bickering`
    : `${s.name} and ${other.name} got talking`);
}

/* ---------- tick ---------- */

function stepSim(s, dtMin) {
  for (const n of NEEDS)
    s.needs[n.k] = Math.max(0, s.needs[n.k] - n.decay * s.decayMul[n.k] * dtMin / 60);

  if (s.path.length) {
    let move = 1.6 * dtMin;
    while (move > 0 && s.path.length) {
      const [gx, gy] = s.path[0];
      const dx = gx - s.tx, dy = gy - s.ty, d = Math.hypot(dx, dy);
      if (d > 0.001) { s.dirx = dx/d; s.diry = dy/d; }
      if (d <= move) { s.tx = gx; s.ty = gy; s.path.shift(); move -= d; }
      else { s.tx += dx/d*move; s.ty += dy/d*move; move = 0; }
    }
    s.bob += dtMin * 2.4;
    think(s);
    return;
  }

  const a = s.act;
  if (!a) { think(s); return; }

  if (a.social) {
    if (chat.on) return;                       // gains handled in stepChat
    const other = s.chatTarget;
    if (!other) { endAct(s); return; }
    const near = Math.abs(other.tx - s.tx) + Math.abs(other.ty - s.ty) <= 1.6;
    if (near) tryChat(s);
    else {
      s.path = findPath(s.tx, s.ty, neighbourTiles(other.tx, other.ty)) || [];
      if (!s.path.length) endAct(s);
    }
    return;
  }

  if (a.tend) {
    const b = babyIn();
    if (!b) { endAct(s); return; }
    for (const k of BABY_NEEDS) b.needs[k] = Math.min(100, b.needs[k] + 3.6 * dtMin);
    s.needs.social = Math.min(100, s.needs.social + 0.9 * dtMin);
    if (BABY_NEEDS.every(k => b.needs[k] > 88)) endAct(s);
    return;
  }

  if (a.fixed) {
    s.timer -= dtMin;
    if (s.timer <= 0) { if (a.then) startAct(a.then, s); else endAct(s); }
    return;
  }

  s.needs[a.need] = Math.min(100, s.needs[a.need] + a.rate * dtMin);
  for (const k in (a.costs || {})) s.needs[k] = Math.max(0, s.needs[k] - a.costs[k] * dtMin);
  for (const k in (a.gains || {})) s.needs[k] = Math.min(100, s.needs[k] + a.gains[k] * dtMin);
  if (s.needs[a.need] >= a.cap) {
    if (s.actKey === 'sleep') addLog(`${s.name} woke up`);
    endAct(s);
  }
  think(s);
}

function stepChat(dtMin) {
  if (!chat.on) return;
  const pair = [chat.a, chat.b].filter(Boolean);
  const couple = pair.length === 2 && pair.every(p => p.stage === 'adult');
  if (chat.mode === 'argue') {
    for (const s of pair) {
      s.needs.social = Math.min(100, s.needs.social + 0.8 * dtMin);
      s.needs.fun = Math.max(0, s.needs.fun - 1.1 * dtMin);
    }
    if (couple) rel = Math.max(0, rel - 0.55 * dtMin);
    chat.timer -= dtMin;
    if (chat.timer <= 0) endChat(true);
    return;
  }
  const bonus = (0.8 + rel/120) * (family.partners ? 1.25 : 1);
  for (const s of pair) {
    s.needs.social = Math.min(100, s.needs.social + 3.0 * bonus * dtMin);
    s.needs.fun = Math.min(100, s.needs.fun + 0.9 * dtMin);
  }
  if (couple) rel = Math.min(100, rel + 0.30 * dtMin);
  chat.timer -= dtMin;
  if (chat.timer <= 0 || pair.every(s => s.needs.social > 96)) endChat(true);
}

// who a Sim goes to talk to: their partner by preference, otherwise whoever is nearest
function partnerFor(s) {
  let best = null, bestD = 1e9;
  for (const p of people) {
    if (p === s || !p.mobile || p.actKey === 'sleep') continue;
    let d = Math.abs(p.tx - s.tx) + Math.abs(p.ty - s.ty);
    if (family.partners && s.stage === 'adult' && p.stage === 'adult') d -= 5;
    if (d < bestD) { bestD = d; best = p; }
  }
  return best;
}

/* ---------- growing up ---------- */

const BABY_DECAY = { hunger:9.5, energy:7.5, hygiene:8.0, social:7.0 };

function stepBaby(b, dtMin) {
  for (const k of BABY_NEEDS)
    b.needs[k] = Math.max(0, b.needs[k] - BABY_DECAY[k] * dtMin / 60);
  const crib = byId('crib');
  b.tx = crib.x; b.ty = crib.y;
}

function haveBaby() {
  const ad = adults();
  if (ad.length < 2) return;
  const g = Math.random() < 0.5 ? 'm' : 'f';
  const idx = people.length;
  const b = makeSim(idx, randomName(g), g, drawTraits(), paletteFor(g, idx),
                    { stage:'baby', bedId:'kidbed' + family.born, tx:4, ty:1 });
  for (const k of BABY_NEEDS) b.needs[k] = 80;
  people.push(b);
  family.born++;
  addLog(`${ad[0].name} and ${ad[1].name} had a baby — ${b.name}`);
  buildCards();
}

function growUp(b) {
  b.stage = 'child';
  b.mobile = true;
  b.scale = 0.74;
  b.showNeeds = NEEDS.map(n => n.k);
  for (const n of NEEDS) b.needs[n.k] = Math.max(b.needs[n.k], 55);
  b.tx = 4; b.ty = 1;
  addLog(`${b.name} started walking`);
  buildCards();
}

// once a day: everyone ages, and a settled couple may have a baby
function familyTick() {
  for (const p of people) {
    if (p.stage !== 'adult') p.ageDays++;
    if (p.stage === 'baby' && p.ageDays >= 3) growUp(p);
  }
  if (family.partners && rel >= 78 && family.born < 2 && !babyIn() && Math.random() < 0.34)
    haveBaby();
}

/* ---------- rendering ----------
   Pixel art. The room is drawn one pixel at a time into a small fixed buffer — no
   canvas paths, so nothing is ever anti-aliased — and the canvas is then stretched
   to the window with nearest-neighbour scaling. Every edge is a hard pixel and every
   2:1 iso line is a clean two-pixel stair. */

// 32px tiles: the smallest size where a face still has room for two eyes and a mouth.
const TW = 32, TH = 16, WALL = 40;
const ROOM_W = 336, PH = 220;       // the whole room, plus headroom above the back wall
let PW = ROOM_W, OX = PW >> 1;       // PW grows past the room to fill the stage — see layout()
const OY = 52;

const cv = document.getElementById('c');
const ctx = cv.getContext('2d');
cv.width = PW; cv.height = PH;
let buf  = new Uint32Array(PW * PH);
let glow = new Uint8Array(PW * PH);   // 1 = makes its own light, so the night pass leaves it alone
let EMIT = 0, EM = 0;                   // EMIT: whatever's being drawn glows; EM: set per-pixel by painters
let frameImg = null, frameView = null;

// Every art pixel is always a whole number of device pixels: k is the biggest whole
// scale that fits the room across the stage, and the buffer then widens past the room
// (more backdrop either side) to fill the stage at that same k. Stretching to an exact
// width instead gave fractional scales, where some pixel rows came out fatter than others.
function layout() {
  const dpr = window.devicePixelRatio || 1;
  const dev = Math.floor(cv.parentElement.clientWidth * dpr);
  const k = Math.max(1, Math.floor(dev / ROOM_W));
  const pw = Math.max(ROOM_W, Math.floor(dev / k));
  if (pw !== PW) {
    PW = pw; OX = PW >> 1;
    buf = new Uint32Array(PW * PH); glow = new Uint8Array(PW * PH); stamp = new Uint32Array(PW * PH);
    floorBuf = new Uint32Array(PW * PH);
    LR = new Float32Array(PW * PH); LG = new Float32Array(PW * PH); LB = new Float32Array(PW * PH);
    frameImg = null; floorKey = '';
    cv.width = PW;
  }
  // only a screen narrower than the room itself falls back to shrinking it
  const css = dev < ROOM_W ? cv.parentElement.clientWidth / PW : k / dpr;
  cv.style.width = PW * css + 'px';
  cv.style.height = PH * css + 'px';
}

/* ---------- colour ---------- */

function rgbOf(c) {
  if (c[0] === '#') { const n = parseInt(c.slice(1), 16); return [n >> 16, (n >> 8) & 255, n & 255]; }
  return c.match(/[\d.]+/g).map(Number);
}
const pack = (r, g, b) => (0xff000000 | (b << 16) | (g << 8) | r) >>> 0;
const colMemo = new Map();
function C(c) {
  let v = colMemo.get(c);
  if (v === undefined) { const [r, g, b] = rgbOf(c); v = pack(r | 0, g | 0, b | 0); colMemo.set(c, v); }
  return v;
}
const cR = c => c & 255, cG = c => (c >>> 8) & 255, cB = c => (c >>> 16) & 255;
const clamp8 = v => v < 0 ? 0 : v > 255 ? 255 : v | 0;
const scale = (c, kr, kg = kr, kb = kr) => pack(clamp8(cR(c) * kr), clamp8(cG(c) * kg), clamp8(cB(c) * kb));
const blend = (c, d, t) => pack(clamp8(cR(c) + (cR(d) - cR(c)) * t),
                                clamp8(cG(c) + (cG(d) - cG(c)) * t),
                                clamp8(cB(c) + (cB(d) - cB(c)) * t));

// Takes either '#rrggbb' or an 'rgb(r,g,b)' string it produced itself — DETAIL code
// sometimes hands it an already-shaded colour. Shadows drift toward violet and
// highlights toward warm yellow, the usual pixel-art trick for shading that doesn't
// go muddy.
const shadeMemo = new Map();
function shade(color, amt) {
  const key = color + '@' + amt;
  let v = shadeMemo.get(key);
  if (v) return v;
  const [r, g, b] = rgbOf(color);
  const d = Math.max(0, 1 - amt), u = Math.max(0, amt - 1);
  const k = x => Math.round(Math.min(255, Math.max(0, x)));
  v = `rgb(${k(r*amt + u*26)},${k(g*amt + d*4 + u*14)},${k(b*amt + d*34 - u*14)})`;
  shadeMemo.set(key, v);
  return v;
}
const lineMemo = new Map();
function lineOf(color) {        // outlines are a darkened version of the fill, not flat black
  let v = lineMemo.get(color);
  if (v === undefined) { v = blend(C(shade(color, 0.45)), C('#1d1526'), 0.5); lineMemo.set(color, v); }
  return v;
}

const BAYER = [0,8,2,10,12,4,14,6,3,11,1,9,15,7,13,5].map(v => (v + 0.5) / 16);
const bayer = (x, y) => BAYER[(y & 3) * 4 + (x & 3)];
function hash(a, b) {
  let h = Math.imul(a | 0, 374761393) ^ Math.imul(b | 0, 668265263);
  h = Math.imul(h ^ (h >>> 13), 1274126177);
  return ((h ^ (h >>> 16)) >>> 0) / 4294967296;
}

/* ---------- raster primitives ---------- */

// iso projection; z is height in pixels. Rounded so every vertex sits on the grid.
const P  = (gx, gy, z = 0) => ({ x: Math.round(OX + (gx - gy) * TW/2), y: Math.round(OY + (gx + gy) * TH/2 - z) });
const P3 = (gx, gy, zt) => P(gx, gy, zt * TW);          // height in tiles

function put(x, y, c) {
  if (x < 0 || y < 0 || x >= PW || y >= PH) return;
  const i = y * PW + x; buf[i] = c; glow[i] = EMIT;
}

// even-odd scanline fill sampling pixel centres — the only rasteriser in the file
function scan(pts, cb) {
  let minY = Infinity, maxY = -Infinity;
  for (const p of pts) { if (p.y < minY) minY = p.y; if (p.y > maxY) maxY = p.y; }
  const y0 = Math.max(0, Math.ceil(minY - 0.5)), y1 = Math.min(PH - 1, Math.floor(maxY - 0.5));
  const n = pts.length, xs = [];
  for (let y = y0; y <= y1; y++) {
    const sy = y + 0.5; xs.length = 0;
    for (let i = 0; i < n; i++) {
      const a = pts[i], b = pts[(i + 1) % n];
      if ((a.y <= sy) !== (b.y <= sy)) xs.push(a.x + (sy - a.y) * (b.x - a.x) / (b.y - a.y));
    }
    xs.sort((p, q) => p - q);
    for (let k = 0; k + 1 < xs.length; k += 2) {
      const xa = Math.max(0, Math.ceil(xs[k] - 0.5)), xb = Math.min(PW - 1, Math.ceil(xs[k+1] - 0.5) - 1);
      for (let x = xa; x <= xb; x++) cb(x, y);
    }
  }
}

// fill is a packed colour, or fn(x, y, existing) returning one (0 = leave the pixel alone)
function fillPoly(pts, fill) {
  if (typeof fill === 'function')
    scan(pts, (x, y) => {
      const i = y * PW + x; EM = 0;
      const c = fill(x, y, buf[i]);
      if (c) { buf[i] = c; glow[i] = EMIT | EM; }
    });
  else scan(pts, (x, y) => { const i = y * PW + x; buf[i] = fill; glow[i] = EMIT; });
}

function line(a, b, c) {
  let x0 = a.x, y0 = a.y; const x1 = b.x, y1 = b.y;
  const dx = Math.abs(x1 - x0), dy = -Math.abs(y1 - y0), sx = x0 < x1 ? 1 : -1, sy = y0 < y1 ? 1 : -1;
  let err = dx + dy;
  for (;;) {
    put(x0, y0, c);
    if (x0 === x1 && y0 === y1) break;
    const e2 = 2 * err;
    if (e2 >= dy) { err += dy; x0 += sx; }
    if (e2 <= dx) { err += dx; y0 += sy; }
  }
}

// Outlines are found, not stroked: rasterise the silhouette into a scratch stamp and
// colour the pixels on its border. That keeps every outline exactly one pixel, inside
// the shape, whatever the rounding did to the vertices.
let stamp = new Uint32Array(PW * PH);
let stampId = 0;
function mark(pts) {
  const id = ++stampId; let x0 = PW, x1 = -1, y0 = PH, y1 = -1;
  scan(pts, (x, y) => {
    stamp[y * PW + x] = id;
    if (x < x0) x0 = x; if (x > x1) x1 = x; if (y < y0) y0 = y; if (y > y1) y1 = y;
  });
  return { id, x0, x1, y0, y1 };
}
function outline(pts, c) {
  const m = mark(pts);
  for (let y = m.y0; y <= m.y1; y++) for (let x = m.x0; x <= m.x1; x++) {
    const i = y * PW + x;
    if (stamp[i] !== m.id) continue;
    if (x === 0 || y === 0 || x === PW - 1 || y === PH - 1 || stamp[i-1] !== m.id ||

/* ---------- people ----------

   builder covers adults and children, both sexes, four facings (two drawn, two

const SW = 18, SH = 30, SAX = 9;         // anchor column: feet (or lap) are centred on it

  adult: { hw:10, hh:9, bw:8, bh:6, lh:4, e0:4, e1:7, ey:5 },
  child: { hw:8,  hh:8, bw:6, bh:4, lh:3, e0:3, e1:6, ey:4 },
  baby:  { hw:8,  hh:7, bw:6, bh:4, lh:3, e0:2, e1:5, ey:3 },
};

function buildPerson(c, gender, stage, pose, fr, back, face) {
  const D = DIMS[stage] || DIMS.adult;

  const set = (x, y, v) => { if (x >= 0 && y >= 0 && x < SW && y < SH) g[y * SW + x] = v; };
  const rect = (x, y, w, h, v) => { for (let j = 0; j < h; j++) for (let i = 0; i < w; i++) set(x + i, y + j, v); };

  const lum = h => { const [r, g, b] = rgbOf(h); return r * .3 + g * .59 + b * .11; };
  // (always darken: lightening dark-brown hair turns it orange, and every skin tone is light enough to contrast with near-black)
  const hair = Math.abs(lum(c.hair) - lum(c.skin)) < 45 ? shade(c.hair, .5) : c.hair;
  const K = {
    sk:C(c.skin), skS:C(shade(c.skin, .84)), hr:C(hair), hrL:C(shade(hair, 1.45)),
    sh:C(c.shirt), shS:C(shade(c.shirt, .76)), pn:C(pants), pnS:C(shade(pants, .76)),
    shoe:C('#3b2d2a'), eye:C('#231a2c'), mouth:C('#8e3f45'), blush:C('#f09a98'), tear:C('#8fd0f0'),
    gtr:C('#c98a3e'), gtrD:C('#6a4028'),

  if (onlyHead) { headTop = 26 - D.hh; ay = 25; }

    const fy = sit ? 24 : 25;               // lap row when seated, sole row when standing
    ay = fy;
    legTop = sit ? 24 : fy - D.lh;
    const up = pose === 'walk' && (fr & 1) ? 1 : 0;   // bob up on the passing frames
    bodyTop = legTop - D.bh - up;
    headTop = bodyTop - D.hh;

    const lw = D.bw / 2 - 1, legs = [bx + 1, cx];
    if (!sit) {
      const lift = pose === 'walk' ? [fr === 1 ? 1 : 0, fr === 3 ? 1 : 0] : [0, 0];
      legs.forEach((x, k) => {
        const bot = fy - lift[k];
        if (fem) rect(x + (k ? 0 : 1), legTop, lw - 1, bot - legTop, k ? K.sk : K.skS);
        else rect(x, legTop, lw, bot - legTop, k ? K.pn : K.pnS);
        rect(x, bot, lw, 1, K.shoe);

    } else {
      rect(bx, legTop, D.bw, 1, fem ? K.shS : K.pn);           // lap

        if (fem) rect(x + (k ? 0 : 1), fy + 1, lw - 1, 2, k ? K.sk : K.skS);
        else rect(x, fy + 1, lw, 2, k ? K.pn : K.pnS);
        rect(x, fy + 3, lw, 1, K.shoe);
      });
    }

    rect(bx, bodyTop, D.bw, D.bh, K.sh);
    rect(bx, bodyTop, 1, D.bh, K.shS);                          // shadow side
    if (fem) {                                                  // skirt
      rect(bx, legTop - 2, D.bw, 2, K.shS);

    } else rect(bx, legTop - 1, D.bw, 1, K.pnS);               // waistband
    if (!back) { set(cx, bodyTop, K.sk); set(cx + 1, bodyTop, K.sk); }

    };

      const r = bodyTop + 1;

    } else if (pose === 'guitar') {

      const gy = bodyTop + 2;                                     // slung across the body
      rect(bx, gy + 1, 4, 3, K.gtr); rect(bx + 1, gy, 2, 1, K.gtr); rect(bx + 1, gy + 4, 2, 1, K.gtr);
      set(bx + 2, gy + 2, K.gtrD);

  rect(hx, headTop, D.hw, D.hh, K.sk);
  for (const [x, y] of [[hx, headTop], [hx + D.hw - 1, headTop], [hx, headTop + D.hh - 1], [hx + D.hw - 1, headTop + D.hh - 1]])
    set(x, y, 0);
  rect(hx + 1, headTop + D.hh - 1, D.hw - 2, 1, K.skS);
  if (baby) {
    set(cx - 1, headTop, K.hr); set(cx, headTop, K.hr); set(cx, headTop - 1, K.hr);
  } else if (back) {
    rect(hx + 1, headTop, D.hw - 2, 1, K.hr);
    rect(hx, headTop + 1, D.hw, D.hh - 2, K.hr);
    if (fem) rect(hx + 1, headTop + D.hh - 1, D.hw - 2, 4, K.hr);   // long hair down the back
    set(hx + D.hw - 1, headTop + D.ey, K.skS);                        // ear
    set(hx + 3, headTop + 1, K.hrL); set(hx + 4, headTop + 1, K.hrL);

    if (!fem) set(hx + 1, headTop + D.ey, K.skS);                     // ear
    rect(hx + 1, headTop, D.hw - 2, 1, K.hr);
    rect(hx, headTop + 1, D.hw, 2, K.hr);
    rect(hx, headTop + 3, 2, 3, K.hr);                                // back of the head
    rect(hx + 2, headTop + 3, 3, 1, K.hr);                            // fringe
    set(hx + D.hw - 1, headTop + 3, K.hr);
    if (fem) {
      rect(hx, headTop + 3, 2, D.hh, K.hr);
      rect(hx + D.hw - 1, headTop + 3, 1, 4, K.hr);
      rect(hx + 2, headTop + 3, 4, 1, K.hr);
    }
    set(hx + 3, headTop + 1, K.hrL); set(hx + 4, headTop + 1, K.hrL); set(hx + 2, headTop + 2, K.hrL);
  }

  if (!back) {
    const e0 = hx + D.e0, e1 = hx + D.e1, ey = headTop + D.ey, my = ey + 2, mx = e0 + 1, E = K.eye;
    if (face === 'sleep' || face === 'blink') {

    } else if (face === 'angry') {
      set(e0, ey + 1, E); set(e1, ey + 1, E); set(e0 - 1, ey, E); set(e1 + 1, ey, E);
    } else {
      rect(e0, ey, 1, 2, E); rect(e1, ey, 1, 2, E);

    if (face === 'happy' || face === 'talk') {
      set(mx, my, K.mouth); set(mx + 1, my, K.mouth);
      if (face === 'talk') { set(mx, my + 1, K.mouth); set(mx + 1, my + 1, K.mouth); }
      else { set(e0 - 1, my, K.blush); set(e1 + 1, my, K.blush); }
    } else if (face === 'angry') { set(mx, my, E); set(mx + 1, my, E); }
    else if (face === 'sleep') set(mx, my, K.skS);

}

const spriteMemo = new Map();
function personSprite(s, pose, fr, back, face) {
  if (pose !== 'walk' && pose !== 'use' && pose !== 'talk' && pose !== 'stretch' && pose !== 'guitar') fr = 0;
  const c = s.colors;
  const key = [c.skin, c.hair, c.shirt, c.pants, s.gender, s.stage, pose, fr, back ? 1 : 0, back ? '' : face].join('|');
  let sp = spriteMemo.get(key);
  if (!sp) {
    if (spriteMemo.size > 800) spriteMemo.clear();
    sp = buildPerson(c, s.gender, s.stage, pose, fr, back, face);
    spriteMemo.set(key, sp);
  }
  return sp;
}

// back = walking away from the camera; the two away-facings and two toward-facings

function facing(fx, fy) {
  if (Math.abs(fx) >= Math.abs(fy)) return fx < 0 ? { back:true, flip:true } : { back:false, flip:false };

function moodFace(s) {
  if ((animT + s.i * 1.3) % 3.7 < 0.14) return 'blink';
  const m = moodOf(s).label;
  return m === 'happy' || m === 'affectionate' ? 'happy' : m === 'tired' ? 'tired'
       : m === 'grumpy' || m === 'annoyed' ? 'angry' : m === 'lonely' ? 'sad' : 'content';
}
function babyFace(b) {
  const worst = Math.min(...BABY_NEEDS.map(k => b.needs[k]));
  return worst > 60 ? 'sleep' : worst > 30 ? 'content' : 'sad';
}

const inUse = (id, act) => people.some(p => p.held === id && !p.path.length && (!act || p.actKey === act));

/* ---------- the room ---------- */

const BG = '#1a2030';
let floorBuf = new Uint32Array(PW * PH);
let floorKey = '';

// X and Y are tile coordinates ×32, so grid lines land on whole pixels and come out
// as exact two-pixel stairs
function floorPx(px, py) {
  const a = px - OX, b = py - OY, X = a + 2 * b, Y = 2 * b - a;
  if (X < 0 || Y < 0 || X >= 320 || Y >= 320) return 0;
  const gx = X / 32, gy = Y / 32;

  if (gx >= 5.25 && gx < 5.95 && gy >= 1.15 && gy < 1.8)            // bath mat
    return C((Y >> 1) & 1 ? '#8fc6d8' : '#a5d4e2');
  if (gx >= 5 && gy < 4) {                                           // bathroom: small square tiles
    if ((X & 15) < 2 || (Y & 15) < 2) return C('#9eb2ba');
    return C((((X >> 4) + (Y >> 4)) & 1) ? '#dce8ec' : '#cddde3');
  }
  if (gy < 4) {                                                      // bedroom carpet
    const h = hash(px, py);
    return C(h < 0.1 ? '#a8866c' : h > 0.93 ? '#c9a78b' : '#b8957a');
  }
  if (gx < 4 && gy < 7)                                              // kitchen lino
    return C((((X >> 4) + (Y >> 4)) & 1) ? '#e8dfc9' : '#b9ccc4');

  const X0 = 176, X1 = 272, Y0 = 208, Y1 = 280;                     // living-room rug
  if (Y >= Y0 + 2 && Y < Y1 - 2 && ((X >= X0 - 4 && X < X0) || (X >= X1 && X < X1 + 4)))
    if ((Y & 3) < 2) return C('#efe2c8');
  if (X >= X0 && X < X1 && Y >= Y0 && Y < Y1) {
    const d = Math.min(X - X0, X1 - 1 - X, Y - Y0, Y1 - 1 - Y);
    if (d < 3 || (d >= 6 && d < 9)) return C('#7d3434');
    if (d < 6) return C('#e0b457');
    const m = Math.abs(X - 224) + Math.abs(Y - 244);
    return C(m % 16 < 3 ? '#e0b457' : m % 16 < 5 ? '#9a4640' : '#b8574d');
  }

  const row = Y >> 3, off = (row * 19) % 48;                         // oak planks, staggered
  if ((Y & 7) < 2 || (X + off) % 48 < 2) return C('#7d5836');
  const t = hash(row, Math.floor((X + off) / 48));
  const base = t < 0.33 ? '#b98a58' : t < 0.66 ? '#ae8052' : '#c29562';
  return C(hash(px, py) > 0.94 ? shade(base, 0.9) : base);
}

function bakeFloor() {
  buf.fill(C(BG)); glow.fill(0);
  // the floor slab's edges, so the flat reads as a little diorama block
  fillPoly([P(10,0), P(10,10), P(10,10,-6), P(10,0,-6)], C('#5b4332'));
  fillPoly([P(0,10), P(10,10), P(10,10,-6), P(0,10,-6)], C('#47352a'));
  line(P(0,10,-6), P(10,10,-6), C(OUTLINE)); line(P(10,10,-6), P(10,0,-6), C(OUTLINE));
  fillPoly([P(0,0), P(10,0), P(10,10), P(0,10)], (x, y) => floorPx(x, y));
  line(P(0,10), P(10,10), C('#d6b58a')); line(P(10,10), P(10,0), C('#d6b58a'));

  const dim = k => (x, y, c) => scale(c, k);
  for (const o of OBJECTS) if (o.id !== 'mat')                         // contact shadows
    fillPoly([P(o.x+.08, o.y+.08), P(o.x+o.w+.1, o.y+.08), P(o.x+o.w+.1, o.y+o.h+.1), P(o.x+.08, o.y+o.h+.1)], dim(0.8));
  for (const tag of walls) {                                            // floor darkens where it meets a wall
    const [dir, xs, ys] = tag.split(':'), x = +xs, y = +ys, along = dir === 'N' ? y : x;
    if (wallHeight(along) <= 0) continue;
    const a = along === 0 ? 0 : -0.18, b = 0.18;
    fillPoly(dir === 'N' ? [P(x,y+a), P(x+1,y+a), P(x+1,y+b), P(x,y+b)]
                         : [P(x+a,y), P(x+b,y), P(x+b,y+1), P(x+a,y+1)], dim(0.87));
  }
  floorBuf.set(buf);
}

function wallHeight(coord) {   // px
  if (coord === 0 || wallMode === 'full') return WALL;
  return wallMode === 'off' ? 0 : 9;
}

const WALLPAPER = {
  bed(ux, v)     { if (v < 3) return v < 2 ? '#e9dfd0' : '#7a6a8e';
                   return (ux & 7) < 2 ? '#b4a5cd' : '#a797c3'; },
  bath(ux, v)    { if (v < 18) return ((ux & 3) === 0 || (v & 3) === 1) ? '#b3c8c7' : '#e3eeec';
                   return v < 20 ? '#7fa9a5' : '#a9d0cb'; },
  kitchen(ux, v) { if (v < 3) return v < 2 ? '#c2a574' : '#8c7248';
                   if (v >= 17 && v < 26) {
                     const tu = Math.floor(ux / 3), tv = Math.floor((v - 17) / 3);
                     if (ux % 3 === 0 || (v - 17) % 3 === 0) return '#cdbf9c';
                     return (tu + tv) & 1 ? '#f2ede0' : '#d9ebe4';
                   }
                   return '#e5d3a3'; },
  living(ux, v)  { if (v < 3) return v < 2 ? '#efe6d6' : '#4f6f64';
                   if (v === 14) return '#5d8577';
                   if (v < 14) return '#6f978a';
                   return ((ux + ((v >> 2) & 1) * 4) & 7) === 0 && (v & 3) === 2 ? '#94bcae' : '#7aa295'; },
};
function wallTheme(dir, f, u) {
  if (dir === 'N') return f < 1 ? (u < 5 ? 'bed' : 'bath') : (u < 4 ? 'kitchen' : 'living');
  return f < 1 ? (u < 4 ? 'bed' : u < 7 ? 'kitchen' : 'living') : 'bath';
}

let skyTop = [0,0,0], skyBot = [0,0,0], clockHands = new Set();
const hexA = h => rgbOf(h);
const SKY = [
  [0,    hexA('#141a36'), hexA('#2a3160')],
  [5,    hexA('#141a36'), hexA('#2a3160')],
  [6.2,  hexA('#5b6aa8'), hexA('#f2a57c')],
  [7.5,  hexA('#79b8e6'), hexA('#c6e6f2')],
  [17,   hexA('#79b8e6'), hexA('#c6e6f2')],

  [21.5, hexA('#141a36'), hexA('#2a3160')],

];
function keyed(frames, h, k = 1) {
  for (let i = 0; i < frames.length - 1; i++) {
    const a = frames[i], b = frames[i + 1];
    if (h >= a[0] && h <= b[0]) {
      const t = (h - a[0]) / (b[0] - a[0]);
      return a[k].map((v, j) => v + (b[k][j] - v) * t);
    }
  }
  return frames[0][k];
}
const isNight = () => { const h = hour(); return h < 5.6 || h > 20.4; };

function windowPx(lu, lv, d) {
  const w = d.w, h = d.h;
  if (d.curtains) {
    const inL = lu >= -4 && lu < 2, inR = lu >= w - 2 && lu < w + 4;
    if ((inL || inR) && lv >= -4 && lv < h + 2) return (lu + 16) % 2 ? '#c4645a' : '#a3504a';
    if (lv >= h + 2 && lv < h + 4 && lu >= -5 && lu < w + 5) return lv === h + 2 ? '#4e3626' : '#6b4a36';
  }
  if (lu < 0 || lu >= w) return 0;
  if (lv < 0) return lv >= -2 ? (lv === -1 ? '#f4eee2' : '#a99d88') : 0;      // sill
  if (lv >= h) return 0;
  if (lu < 2 || lu >= w - 2 || lv < 2 || lv >= h - 2 || Math.abs(lu - (w - 1) / 2) < 1 || lv === Math.round(h * 0.62))
    return (lu === 0 || lu === w - 1 || lv === 0 || lv === h - 1) ? '#b3a792' : '#f1ebe0';
  EM = 1;
  return skyPx(lu, lv, w, h);
}
function skyPx(lu, lv, w, h) {
  const night = isNight();
  // a distant skyline along the bottom of the glass, windows lit after dark
  const bh = 3 + Math.floor(hash(Math.floor((lu + w * 3) / 4), 7) * 6);
  if (lv < bh) {
    if (night && (lu & 1) && lv % 3 === 1 && lv < bh - 1 && hash(lu * 5, lv) > 0.45) return C('#f2cf78');
    return night ? C('#1d2440') : blend(pack(...skyBot.map(v => v | 0)), C('#5f7896'), 0.55);
  }
  if (!night) {
    for (let k = 0; k < 2; k++) {
      const cx = ((minutes * 0.2 + k * 23 + w) % (w + 16)) - 8, cy = h * 0.66 + k * 3;
      const q1 = (lu - cx) ** 2 / 9 + (lv - cy) ** 2 / 2, q2 = (lu - cx - 3) ** 2 / 6 + (lv - cy - 1) ** 2 / 2;
      if (q1 < 1 || q2 < 1) return C(lv < cy ? '#dbe4ef' : '#f7f9fc');
    }
  } else {
    if ((lu - w * 0.7) ** 2 + (lv - h * 0.76) ** 2 < 5) return C('#efe9c8');
    if (hash(lu * 7, lv * 13) > 0.965) return C('#e8e6d0');
  }
  const t = Math.floor((lv / h) * 4 + bayer(lu, lv)) / 4;           // four dithered bands
  return pack(...skyBot.map((v, j) => (v + (skyTop[j] - v) * t) | 0));
}
function prepClock() {
  clockHands = new Set();
  const h = hour(), m = minutes % 60;
  const hand = (a, len) => {
    for (let t = 0; t <= len; t += 0.5)
      clockHands.add(Math.round(5 + Math.sin(a) * t) * 16 + Math.round(5 + Math.cos(a) * t));
  };
  hand((h % 12) / 12 * Math.PI * 2, 2.6);
  hand(m / 60 * Math.PI * 2, 3.8);
}
function clockPx(lu, lv) {
  const r2 = (lu - 5) ** 2 + (lv - 5) ** 2;
  if (r2 > 30) return 0;
  if (r2 > 19) return '#6b4a36';
  if (clockHands.has(lu * 16 + lv)) return '#2b2238';
  return (r2 > 13 && (lu === 5 || lv === 5)) ? '#9a8a78' : '#f6f1e4';
}

function wallPx(dir, f, px, py) {
  const [u, v] = dir === 'N' ? onS(f, px, py) : onE(f, px, py);
  const ux = Math.floor(u * 16), vy = Math.floor(v);
  if (f === 0) for (const d of DECOR) {
    if (d.dir !== dir) continue;
    let lu = ux - Math.round(d.u * 16);
    const lv = vy - d.v;
    if (lu < -d.pad || lu >= d.w + d.pad || lv < -d.pad || lv >= d.h + d.pad) continue;
    if (dir === 'W') lu = d.w - 1 - lu;      // the west wall runs right-to-left on screen
    let c;
    if (d.paint) c = d.paint(lu, lv, d);
    else {
      const a = DECOR_ART[d.art], ch = lu >= 0 && lv >= 0 && lu < d.w && lv < d.h ? a.rows[d.h - 1 - lv][lu] : '.';
      c = a.pal[ch] || 0;
    }
    if (c) return typeof c === 'string' ? C(c) : c;
  }
  return C(WALLPAPER[wallTheme(dir, f, u)](ux, vy));
}

// Walls have real thickness now: a papered face, a cap along the top and, where a
// run stops (a doorway or the room's corner), an end face.
function drawWall(dir, x, y) {
  const along = dir === 'N' ? y : x, h = wallHeight(along);
  if (h <= 0) return;
  const outer = along === 0, t = outer ? 0.16 : 0.12;
  const f = outer ? 0 : along + t / 2, bk = f - t;
  const cap = C(outer ? '#e8e0d0' : '#ddd3c2'), edge = C(OUTLINE), hi = C('#fbf6ec'), end = C('#b1a592');
  if (dir === 'N') {
    const x0 = outer && x === 0 ? -t : x;
    fillPoly([P(x,f,0), P(x+1,f,0), P(x+1,f,h), P(x,f,h)], (px, py) => wallPx('N', f, px, py));
    fillPoly([P(x0,bk,h), P(x+1,bk,h), P(x+1,f,h), P(x0,f,h)], cap);
    line(P(x0,bk,h), P(x+1,bk,h), edge);
    line(P(x,f,h), P(x+1,f,h), hi);
    if (!walls.has(`N:${x+1}:${y}`)) {
      fillPoly([P(x+1,f,0), P(x+1,bk,0), P(x+1,bk,h), P(x+1,f,h)], end);
      line(P(x+1,bk,0), P(x+1,bk,h), edge); line(P(x+1,bk,h), P(x+1,f,h), edge);
      line(P(x+1,f,0), P(x+1,f,h), edge);
    }
    if (!outer && !walls.has(`N:${x-1}:${y}`)) line(P(x,bk,h), P(x,f,h), edge);
  } else {
    const y0 = outer && y === 0 ? -t : y;
    fillPoly([P(f,y,0), P(f,y+1,0), P(f,y+1,h), P(f,y,h)], (px, py) => wallPx('W', f, px, py));
    fillPoly([P(bk,y0,h), P(f,y0,h), P(f,y+1,h), P(bk,y+1,h)], cap);
    line(P(bk,y0,h), P(bk,y+1,h), edge);
    line(P(f,y,h), P(f,y+1,h), hi);
    if (!walls.has(`W:${x}:${y+1}`)) {
      fillPoly([P(bk,y+1,0), P(f,y+1,0), P(f,y+1,h), P(bk,y+1,h)], end);
      line(P(bk,y+1,0), P(bk,y+1,h), edge); line(P(bk,y+1,h), P(f,y+1,h), edge);
      line(P(f,y+1,0), P(f,y+1,h), edge);
    }
    if (!outer && !walls.has(`W:${x}:${y-1}`)) line(P(bk,y,h), P(f,y,h), edge);
  }
}

function sunPatches() {
  const h = hour();
  let a = 0, tint;
  if (h > 6.5 && h < 18.5) { a = 0.55 * Math.sin(Math.PI * (h - 6.5) / 12); tint = c => scale(c, 1.2, 1.13, 0.96); }
  else if (isNight())       { a = 0.3; tint = c => scale(c, 0.95, 1.02, 1.25); }
  if (a <= 0.02) return;
  // dithered, so the light has a density instead of a flat wash
  const f = (x, y, c) => bayer(x, y) < a ? tint(c) : 0;
  fillPoly([P(8.1,0), P(9.4,0), P(9.8,2.3), P(8.5,2.3)], f);
  fillPoly([P(0,6.3), P(0,7.7), P(2.3,8.1), P(2.3,6.7)], f);
}

/* ---------- where and how each person is drawn ---------- */

// Poses key off arrival, not intent — nobody sits down until they've got there.
function placeSim(s) {
  const arrived = !s.path.length && !!s.held;
  const o = arrived ? byId(s.held) : null;
  let gx = s.tx + 0.5, gy = s.ty + 0.5, z = 0, fx = s.dirx, fy = s.diry;
  let pose = s.path.length ? 'walk' : 'stand', depth = gx + gy;
  if (o) {
    const ocx = o.x + o.w / 2, ocy = o.y + o.h / 2;
    const users = people.filter(p => p.held === o.id && !p.path.length && p.mobile);
    const slot = Math.max(0, users.indexOf(s)) % 2;
    fx = ocx - gx; fy = ocy - gy;
    // drawn at the furniture, so sorted at the furniture — otherwise sleepers vanish behind the bed
    depth = ocx + ocy + 0.55;
    switch (s.actKey === 'sleep' ? 'bed' : o.id) {
      case 'bed':    pose = 'lie'; break;
      case 'sofa':   gx = o.x + .55 + slot * .9; gy = o.y + .56; z = .19; pose = 'sit'; fx = 0; fy = 1; break;
      case 'toilet': gx = ocx; gy = o.y + .5; z = .17; pose = 'sit'; fx = 0; fy = 1; break;
      case 'table':  gx = o.x + .55 + slot * .9; gy = o.y + 1.14; z = .19; pose = 'sitback'; fx = 0; fy = -1; break;
      case 'desk':   gx = o.x + .8; gy = o.y + .5; z = .22; pose = 'sitback'; fx = -1; fy = 0; break;
      case 'mat':    gx = ocx; gy = ocy; pose = 'stretch'; fx = .3; fy = 1; break;
      case 'shower': gx = ocx; gy = ocy; fx = 0; fy = 1; break;
      case 'guitar': gx += (ocx - gx) * .3; gy += (ocy - gy) * .3; pose = 'guitar'; fx = 0; fy = 1; break;
      default:       gx += (ocx - gx) * .28; gy += (ocy - gy) * .28; pose = 'use';
    }
  }
  if (s.actKey === 'chat' && chat.on && !s.path.length && (chat.a === s || chat.b === s)) {
    const other = chat.a === s ? chat.b : chat.a;
    if (other) { fx = other.tx - s.tx; fy = other.ty - s.ty; pose = 'talk'; }
  }
  return { gx, gy, z, fx, fy, pose, o, depth };
}
const simDepth = s => placeSim(s).depth;

function shadowAt(p, rx) {
  for (let dy = -1; dy <= 1; dy++) for (let dx = -rx; dx <= rx; dx++) {
    if ((dx * dx) / (rx * rx) + dy * dy > 1.2 || ((p.x + dx + p.y + dy) & 1)) continue;
    const x = p.x + dx, y = p.y + dy;
    if (x >= 0 && y >= 0 && x < PW && y < PH) buf[y * PW + x] = scale(buf[y * PW + x], .68);
  }
}

function drawSim(s) {
  const pl = placeSim(s);
  if (pl.pose === 'lie') {
    const o = pl.o, L = o.h;
    const hp = P3(o.x + .5, o.y + (L > 1 ? .32 : .26), .3);
    const sp = personSprite(s, 'head', 0, false, 'sleep');
    blit(sp, hp.x - SAX, hp.y - sp.ay);
    box(o.x + .08, o.y + L * .4, .84, L * .6 - .08, .14, .26, o.color);             // duvet pulled up
    box(o.x + .08, o.y + L * .4, .84, .1, .4, .02, '#f1e9da', { outline:false });
    s._head = { x: hp.x, y: hp.y - sp.ay + sp.top };
    return;
  }
  const p = P3(pl.gx, pl.gy, pl.z);
  if (!pl.z) shadowAt(p, s.stage === 'child' ? 4 : 5);
  const { back, flip } = facing(pl.fx, pl.fy);
  const fr = pl.pose === 'walk' ? Math.floor(s.bob * 0.8) & 3 : Math.floor(animT * 2.5 + s.i * .7) & 1;
  let face = s.actKey === 'sleep' ? 'sleep' : moodFace(s);
  if (pl.pose === 'talk' && face !== 'blink') face = chat.mode === 'argue' ? 'angry' : fr ? 'talk' : 'happy';
  const sp = personSprite(s, pl.pose, fr, back, face);
  blit(sp, p.x - SAX, p.y - sp.ay, flip);
  s._head = { x: p.x, y: p.y - sp.ay + sp.top };
}

const ICON_OF = { sleep:'zzz', tend:'bottle', eat:'plate', cook:'pan', snack:'sandwich', toilet:'drop',
                  shower:'shower', wash:'bubbles', tv:'tv', read:'book', paint:'palette', guitar:'note',
                  arcade:'joystick', stretch:'stretch', online:'chat', relax:'leaf', chat:'dots' };
function iconFor(s) {
  if (s.stage === 'baby') return Math.min(...BABY_NEEDS.map(k => s.needs[k])) < 30 ? 'drop' : null;
  if (!s.actKey || (s.actKey === 'sleep' && !s.path.length)) return null;   // the Zs say it
  if (s.actKey === 'chat' && chat.on)
    return chat.mode === 'argue' ? 'anger' : (rel > 52 || family.partners) ? 'heart' : 'dots';
  return ICON_OF[s.actKey];
}
function drawBubble(s) {
  const icon = iconFor(s);
  if (!icon || !s._head) return;
  const bx = Math.min(PW - BUBBLE.w, s._head.x + 2), by = Math.max(0, s._head.y - BUBBLE.h + 1);
  blit(BUBBLE, bx, by);
  blit(ICON[icon], bx + 3, by + 2);
}

/* ---------- particles ---------- */

const parts = [];
function spawn(kind, x, y, vx, vy, life) {
  if (parts.length < 160) parts.push({ kind, x, y, vx, vy, life, age: 0 });
}
function emitParticles(dt) {
  if (!dt) return;
  const chance = r => Math.random() < r * dt, rnd = (a, b) => a + Math.random() * (b - a);
  for (const s of people) {
    const hd = s._head, here = !s.path.length;
    if (!hd || !here) continue;
    if (s.actKey === 'sleep' && chance(0.7)) spawn('z', hd.x + 3, hd.y + 1, 3, -6, 2.4);
    if (s.actKey === 'guitar' && chance(1.4)) spawn('note', hd.x + 5, hd.y + 8, rnd(3, 7), -9, 1.7);
  }
  if (chat.on && chat.a && chat.b && chat.a._head && chat.b._head) {
    const mx = (chat.a._head.x + chat.b._head.x) / 2, my = Math.min(chat.a._head.y, chat.b._head.y);
    if (chat.mode === 'argue') { if (chance(1.6)) spawn('anger', mx + rnd(-8, 4), my + rnd(-2, 4), 0, -4, 0.9); }
    else if ((rel > 45 || family.partners) && chance(0.9)) spawn('heart', mx + rnd(-4, 2), my + 2, rnd(-2, 2), -8, 1.8);
  }
  if (inUse('stove', 'cook') && chance(5)) {
    const p = P3(.3, 5.3, .62);
    spawn('steam', p.x + rnd(-2, 2), p.y, rnd(-2, 2), -10, 1.3);
  }
  if (inUse('shower')) {
    for (let k = 0; k < 3; k++) if (chance(14)) {
      const p = P3(rnd(5.25, 5.75), rnd(.25, .75), .82);
      spawn('drop', p.x, p.y, 0, 70, .38);
    }
    if (chance(3)) { const p = P3(5.5, .5, .9); spawn('steam', p.x + rnd(-5, 5), p.y, rnd(-2, 2), -6, 1.6); }
  }
}
function stepParticles(dt) {
  for (let i = parts.length - 1; i >= 0; i--) {
    const p = parts[i];
    p.age += dt;
    if (p.age >= p.life) { parts.splice(i, 1); continue; }
    p.x += p.vx * dt; p.y += p.vy * dt;
  }
}
function drawParticles() {
  for (const p of parts) {
    const x = Math.round(p.x + (p.kind === 'z' || p.kind === 'heart' ? Math.sin(p.age * 4) * 1.5 : 0));
    const y = Math.round(p.y);
    if (p.kind === 'steam') {
      const r = 1 + Math.floor(p.age * 2);
      for (let dy = -r; dy <= r; dy++) for (let dx = -r; dx <= r; dx++) {
        const qx = x + dx, qy = y + dy;
        if (dx*dx + dy*dy > r*r || ((qx + qy) & 1) || qx < 0 || qy < 0 || qx >= PW || qy >= PH) continue;
        buf[qy * PW + qx] = blend(buf[qy * PW + qx], C('#ffffff'), .45 * (1 - p.age / p.life));
      }
    } else if (p.kind === 'drop') {
      put(x, y, C('#a8dcf0')); put(x, y + 1, C('#d8f0fa'));
    } else {
      if (p.age > p.life * .7 && (Math.floor(p.age * 16) & 1)) continue;     // flicker out
      const sp = PARTICLE[p.kind];
      blit(sp, x - (sp.w >> 1), y - (sp.h >> 1));
    }
  }
}

/* ---------- light ---------- */

// ambient multiplier through the day: white at noon, warm at the ends, blue at night
const AMB = [[0,[.38,.43,.66]],[5,[.42,.46,.68]],[6.5,[.86,.78,.78]],[7.5,[1,1,1]],[16.5,[1,1,1]],
             [18.5,[1,.86,.74]],[20,[.62,.64,.84]],[22,[.42,.46,.68]],[24,[.38,.43,.66]]];
let LR = new Float32Array(PW * PH), LG = new Float32Array(PW * PH), LB = new Float32Array(PW * PH);

function activeLights(dark) {
  const L = [], add = (gx, gy, z, r, c, k) => { if (k > 0.01) L.push({ ...P(gx, gy, z), r, c, k }); };
  if (lampsOn) {
    add(9.5, 6.5, 22, 104, [1, .78, .45], .9 * dark);
    const h = hour();
    if (h > 17 || h < 1) add(2.6, .4, 16, 62, [1, .8, .5], .75 * dark);
  }
  const screen = (.3 + .7 * dark);
  if (inUse('sofa', 'tv'))
    add(6.5, 7.9, 14, 72, [.5, .66, 1], screen * (.8 + .2 * Math.sin(animT * 9) * Math.sin(animT * 3.1)));
  if (inUse('fridge'))          add(.95, 4.5, 20, 52, [.85, .95, 1], screen);
  if (inUse('stove', 'cook'))   add(.5, 5.5, 20, 38, [1, .55, .25], screen * .8);
  if (inUse('desk'))            add(.3, 3.5, 22, 40, [.55, .75, 1], screen * .8);
  add(.95, 8.5, 26, 46, [.4, .95, .9], (inUse('arcade') ? 1 : .4) * .8 * dark);
  return L;
}

// Light falls off in quarter steps, dithered where the steps meet — pools with a
// visible edge, the way lamplight looks in pixel art, rather than smooth gradients.
function lightPass(amb, dark) {
  const lights = activeLights(dark);
  if (amb[0] > .995 && amb[1] > .995 && amb[2] > .995 && !lights.length) return;
  LR.fill(amb[0]); LG.fill(amb[1]); LB.fill(amb[2]);
  for (const l of lights) {
    const x0 = Math.max(0, Math.floor(l.x - l.r)), x1 = Math.min(PW - 1, Math.ceil(l.x + l.r));
    const y0 = Math.max(0, Math.floor(l.y - l.r / 2)), y1 = Math.min(PH - 1, Math.ceil(l.y + l.r / 2));
    for (let y = y0; y <= y1; y++) for (let x = x0; x <= x1; x++) {
      const dx = x - l.x, dy = (y - l.y) * 2, d = Math.sqrt(dx * dx + dy * dy) / l.r;
      if (d >= 1) continue;
      const f = Math.floor((1 - d) * 4 + bayer(x, y)) / 4 * l.k;
      if (f <= 0) continue;
      const i = y * PW + x;
      LR[i] += l.c[0] * f; LG[i] += l.c[1] * f; LB[i] += l.c[2] * f;
    }
  }
  for (let i = 0; i < buf.length; i++) {
    if (glow[i]) continue;
    const c = buf[i];
    buf[i] = pack(clamp8((c & 255) * LR[i]), clamp8(((c >>> 8) & 255) * LG[i]), clamp8(((c >>> 16) & 255) * LB[i]));
  }
}

/* ---------- frame ---------- */

let animT = 0;
function render(dt = 0) {
  animT += dt;
  const h = hour(), amb = keyed(AMB, h);
  const dark = Math.max(0, Math.min(1, (1 - (amb[0] + amb[1] + amb[2]) / 3) / 0.5));
  lampsOn = dark > 0.12;
  skyTop = keyed(SKY, h, 1); skyBot = keyed(SKY, h, 2);
  prepClock();

  if (floorKey !== wallMode) { bakeFloor(); floorKey = wallMode; }
  buf.set(floorBuf); glow.fill(0);
  sunPatches();

  const items = [];
  for (const tag of walls) {
    const [dir, xs, ys] = tag.split(':');
    const x = +xs, y = +ys;
    items.push({ depth: x + y - 0.12, draw: () => drawWall(dir, x, y) });
  }
  for (const o of OBJECTS) {
    const d = (o.x + o.w / 2) + (o.y + o.h / 2);
    items.push({ depth: d, draw: () => drawObject(o) });
    if (FRONT[o.id]) items.push({ depth: d + 0.7, draw: () => FRONT[o.id](o) });
  }
  for (const s of people) {
    s._head = null;
    if (s.mobile) items.push({ depth: simDepth(s), draw: () => drawSim(s) });
  }
  items.sort((a, b) => a.depth - b.depth);
  for (const it of items) it.draw();

  lightPass(amb, dark);
  emitParticles(dt);
  stepParticles(dt);
  drawParticles();
  for (const s of people) drawBubble(s);

  if (!frameImg) { frameImg = ctx.createImageData(PW, PH); frameView = new Uint32Array(frameImg.data.buffer); }
  frameView.set(buf);
  ctx.putImageData(frameImg, 0, 0);
}

// a card's little portrait, redrawn only when the face on it changes
function paintPortrait(i, s) {
  if (typeof ImageData === 'undefined') return;
  const el = document.getElementById('face-' + i);
  if (!el || !el.getContext) return;
  const face = s.stage === 'baby' ? babyFace(s) : moodFace(s);
  const key = [face, s.stage, s.colors.hair, s.colors.skin].join('|');
  if (el._key === key) return;
  el._key = key;
  const sp = personSprite(s, 'head', 0, false, face);
  let x0 = SW, x1 = -1, y0 = SH, y1 = -1;
  for (let y = 0; y < SH; y++) for (let x = 0; x < SW; x++)
    if (sp.px[y * SW + x]) { x0 = Math.min(x0, x); x1 = Math.max(x1, x); y0 = Math.min(y0, y); y1 = Math.max(y1, y); }
  const img = new ImageData(16, 16), out = new Uint32Array(img.data.buffer);
  const ox = Math.floor((16 - (x1 - x0 + 1)) / 2) - x0, oy = Math.max(0, Math.floor((16 - (y1 - y0 + 1)) / 2)) - y0;
  for (let y = y0; y <= y1; y++) for (let x = x0; x <= x1; x++) {
    const tx = x + ox, ty = y + oy, c = sp.px[y * SW + x];
    if (c && tx >= 0 && ty >= 0 && tx < 16 && ty < 16) out[ty * 16 + tx] = c;
  }
  el.getContext('2d').putImageData(img, 0, 0);
}

/* ---------- readouts ---------- */

const cards = document.getElementById('cards');

const STAGE_TAG = { baby:'baby', child:'child' };

function buildCards() {
  cards.innerHTML = people.map((s, i) => {
    const rows = s.showNeeds.map(k => {
      const n = NEED(k);
      return `<div class="need-row"><span class="lbl">${n.label}</span>` +
             `<span class="bar"><i id="b-${i}-${k}"></i></span></div>`;
    }).join('');
    const tag = STAGE_TAG[s.stage]
      ? `<span class="traits">${STAGE_TAG[s.stage]}</span>`
      : `<span class="traits">${s.traits.map(t => t.name).join(' · ')}</span>`;
    return `
  <div class="card px">
    <div class="card-head">
      <canvas class="face" id="face-${i}" width="16" height="16" aria-hidden="true"></canvas>
      <div class="who">
        <input class="nm" value="${s.name}" maxlength="8" aria-label="Name" data-i="${i}">
        <span class="moodword" id="mw-${i}"></span>
      </div>
      ${tag}
    </div>
    <div class="act" id="act-${i}"></div>
    <div class="needs">${rows}</div>
  </div>`;
  }).join('');

  cards.querySelectorAll('.nm').forEach(inp => {
    inp.addEventListener('input', () => {
      people[+inp.dataset.i].name = inp.value.trim() || '?';
    });
  });
}
buildCards();

function fmtTime() {
  const m = Math.floor(minutes) % 1440;
  let h = Math.floor(m/60);
  const mm = String(m%60).padStart(2,'0');
  const ap = h < 12 ? 'am' : 'pm';
  h = h%12 === 0 ? 12 : h%12;
  return `${h}:${mm}${ap}`;
}

function addLog(text) {
  if (quiet) return;
  logs.unshift({ t: fmtTime(), text });
  if (logs.length > 30) logs.pop();
  document.getElementById('log').innerHTML =
    logs.map(l => `<li><span class="t">${l.t}</span><span>${l.text}</span></li>`).join('');
}

const cssVar = n => getComputedStyle(document.documentElement).getPropertyValue(n);
const barColor = v => v > 55 ? cssVar('--good') : v > 25 ? cssVar('--mid') : cssVar('--low');

const GOING = {
  sleep:'Heading to bed', eat:'Going to the table', cook:'Heading to the stove',
  snack:'Off to the fridge', toilet:'Hurrying to the bathroom', shower:'Going to shower',
  wash:'Going to the sink', tv:'Heading for the sofa', online:'Walking to the desk',
  relax:'Wandering to the sofa', chat:'Looking for company',
  read:'Going to the bookshelf', paint:'Heading to the easel',
  guitar:'Going for the guitar', arcade:'Off to the arcade cabinet',
  stretch:'Heading for the mat', tend:'Going to the baby',
};

function paintUI() {
  people.forEach((s, i) => {
    for (const k of s.showNeeds) {
      const el = document.getElementById(`b-${i}-${k}`);
      if (!el) return;
      el.style.width = s.needs[k] + '%';
      el.style.background = barColor(s.needs[k]);
    }
    const word = document.getElementById('mw-'+i);
    const act  = document.getElementById('act-'+i);
    if (!word) return;
    paintPortrait(i, s);
    if (s.stage === 'baby') {
      const worst = Math.min(...BABY_NEEDS.map(k => s.needs[k]));
      word.textContent = worst > 60 ? 'settled' : worst > 30 ? 'fussing' : 'crying';
      act.textContent = 'In the crib';
      return;
    }
    const m = moodOf(s);
    word.textContent = m.label;
    act.textContent =
      s.path.length && s.actKey ? (GOING[s.actKey] || 'On the move')
      : s.act ? s.act.verb : 'Deciding what to do';
  });
  document.getElementById('time').textContent = fmtTime();
  document.getElementById('day').textContent = 'Day ' + day;
  const rb = document.getElementById('relBar');
  rb.style.width = rel + '%';
  rb.style.background = barColor(rel);
  const kids = people.length - 2;
  document.getElementById('relVal').textContent =
    family.partners
      ? (kids ? `Family of ${people.length}` : 'Partners')
      : rel>82 ? 'Inseparable' : rel>60 ? 'Close' : rel>38 ? 'Friends'
      : rel>18 ? 'Warming up' : 'Strangers';
}

/* ---------- loop ---------- */

let last = performance.now();
function frame(now) {
  const dt = Math.min(0.1, (now - last)/1000);
  last = now;
  if (speed > 0) {
    const dtMin = dt * MIN_PER_SEC * speed;
    const before = minutes;
    minutes += dtMin;
    if (Math.floor(minutes/1440) > Math.floor(before/1440)) { day++; addLog('A new day'); familyTick(); }
    for (const s of people) (s.mobile ? stepSim : stepBaby)(s, dtMin);
    stepChat(dtMin);
    rel = Math.max(0, rel - 0.0016 * dtMin);
  }
  render(speed > 0 ? dt : 0);
  paintUI();
  requestAnimationFrame(frame);
}

/* ---------- saving and catching up ---------- */

function save() {
  try {
    localStorage.setItem(SAVE_KEY, JSON.stringify({
      v: 4, at: Date.now(), minutes, day, rel, wallMode, family,
      people: people.map(s => ({
        name: s.name, gender: s.gender, stage: s.stage, bedId: s.bedId,
        ageDays: s.ageDays, traits: s.traitKeys, needs: s.needs,
        tx: s.tx, ty: s.ty, emotion: s.emotion, colors: s.colors,
      })),
    }));
  } catch (e) { /* storage unavailable — the sim still runs, it just won't persist */ }
}

// Time away runs far slower than live time: about one in-world day per real hour.
function catchUp(d) {
  const away = Math.min(MAX_AWAY, Math.max(0, (Date.now() - d.at) / 1000 * AWAY_MIN_PER_SEC));
  if (away < 30) return;
  quiet = true;
  let left = away;
  while (left > 0) {
    const dt = Math.min(4, left);
    const before = minutes;
    minutes += dt;
    if (Math.floor(minutes/1440) > Math.floor(before/1440)) { day++; familyTick(); }
    for (const s of people) (s.mobile ? stepSim : stepBaby)(s, dt);
    stepChat(dt);
    rel = Math.max(0, rel - 0.0016 * dt);
    left -= dt;
  }
  quiet = false;
  const hrs = Math.round(away / 60);
  addLog(hrs >= 24
    ? `While you were away, ${Math.round(hrs/24)} day(s) passed here`
    : `While you were away, ${hrs} hour(s) passed here`);
}

document.querySelectorAll('.controls button[data-s]').forEach(b => {
  b.addEventListener('click', () => {
    speed = Number(b.dataset.s);
    document.querySelectorAll('.controls button[data-s]').forEach(o =>
      o.setAttribute('aria-pressed', String(o === b)));
  });
});

const wallBtn = document.getElementById('wallBtn');
if (saved && saved.wallMode) wallMode = saved.wallMode;
wallBtn.textContent = 'Walls: ' + wallMode;
wallBtn.addEventListener('click', () => {
  wallMode = wallMode === 'cutaway' ? 'full' : wallMode === 'full' ? 'off' : 'cutaway';
  wallBtn.textContent = 'Walls: ' + wallMode;
  save();
});

document.getElementById('resetBtn').addEventListener('click', () => {
  try { localStorage.removeItem(SAVE_KEY); } catch (e) {}
  location.reload();
});

setInterval(save, 5000);
window.addEventListener('beforeunload', save);
document.addEventListener('visibilitychange', () => { if (document.hidden) save(); });

window.addEventListener('resize', layout);
layout();
if (saved) { addLog('Back again'); catchUp(saved); }
else addLog('Everyone woke up');
for (const s of people) if (s.mobile && !s.actKey) think(s);
requestAnimationFrame(frame);
</script>
